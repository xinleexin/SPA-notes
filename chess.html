                    (to.row === row && to.col === col)) {
                    square.classList.add('last-move');
                }
            }

            // Highlight king in check
            if (kingPos && kingPos.row === row && kingPos.col === col) {
                square.classList.add('in-check');
            }

            // Add coordinates
            if (col === 0) {
                const rankCoord = document.createElement('span');
                rankCoord.className = 'coord-rank';
                rankCoord.textContent = rows[row];
                square.appendChild(rankCoord);
            }
            
            if (row === 7) {
                const fileCoord = document.createElement('span');
                fileCoord.className = 'coord-file';
                fileCoord.textContent = columns[col];
                square.appendChild(fileCoord);
            }

            // Add piece
            const piece = chessGame.board.grid[row][col];
            if (piece) {
                const pieceSpan = document.createElement('span');
                
                pieceSpan.className = `piece ${piece.color}`;
                pieceSpan.textContent = PIECES[piece.color][piece.type];
                
                square.appendChild(pieceSpan);
            }

            // Add click event
            square.addEventListener('click', () => selectSquare(row, col));
            
            chessBoardElement.appendChild(square);
        }
    }
}

/**
 * Render move history
 */
function renderMoveHistory() {
    moveHistoryList.innerHTML = '';

    if (chessGame.moveHistory.length === 0) {
        moveHistoryList.innerHTML = '<p style="color: #7f8c8d; text-align: center; padding: 20px;">No moves yet</p>';
        return;
    }

    for (let i = 0; i < chessGame.moveHistory.length; i += 2) {
        const row = document.createElement('div');
        row.className = 'history-row';

        const index = document.createElement('div');
        index.className = 'history-index';
        index.textContent = `${Math.floor(i / 2) + 1}.`;

        const whiteMove = document.createElement('div');
        whiteMove.className = 'history-move';
        whiteMove.textContent = chessGame.moveHistory[i]?.notation || '';

        const blackMove = document.createElement('div');
        blackMove.className = 'history-move';
        blackMove.textContent = chessGame.moveHistory[i + 1]?.notation || '';

        row.appendChild(index);
        row.appendChild(whiteMove);
        row.appendChild(blackMove);
        
        moveHistoryList.appendChild(row);
    }

    // Scroll to bottom
    moveHistoryList.scrollTop = moveHistoryList.scrollHeight;
}

/**
 * Update game status display
 */
function updateStatus() {
    if (!chessGame.gameActive) {
        const kingCaptured = chessGame.checkKingCapture();
        
        if (kingCaptured) {
            gameStatusElement.textContent = `${kingCaptured.charAt(0).toUpperCase() + kingCaptured.slice(1)} wins! (King captured)`;
            gameStatusElement.style.backgroundColor = '#e74c3c';
        } else if (chessGame.gameState.isCheckmate()) {
            const winner = chessGame.gameState.currentTurn === 'white' ? 'Black' : 'White';
            gameStatusElement.textContent = `Checkmate! ${winner} wins!`;
            gameStatusElement.style.backgroundColor = '#e74c3c';
        } else if (chessGame.gameState.isStalemate()) {
            gameStatusElement.textContent = 'Stalemate! Game drawn.';
            gameStatusElement.style.backgroundColor = '#f39c12';
        }
        
        return;
    }

    const checkStatus = chessGame.gameState.isCheck(chessGame.gameState.currentTurn) ? ' (CHECK!)' : '';

    // Check if bot is thinking
    if (botDifficulty !== 'none' && 
        chessGame.gameState.currentTurn === 'black' && 
        chessGame.gameActive) {
        
        gameStatusElement.textContent = `Bot (${botDifficulty.charAt(0).toUpperCase() + botDifficulty.slice(1)}) is thinking...`;
        gameStatusElement.style.backgroundColor = '#e67e22';
    } else {
        const turnName = chessGame.gameState.currentTurn.charAt(0).toUpperCase() + 
                        chessGame.gameState.currentTurn.slice(1);
        
        gameStatusElement.textContent = `${turnName}'s turn${checkStatus}`;
        
        if (chessGame.gameState.currentTurn === 'white') {
            gameStatusElement.style.backgroundColor = '#34495e';
        } else {
            gameStatusElement.style.backgroundColor = '#2c3e50';
        }
    }
}

// ============================================
// Timer Functions
// ============================================

function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

/**
 * Start the game timer
 */
function startTimer() {
    stopTimer();
    
    chessGame.currentTurnTime = 0;

    // Show chess clock UI
    const chessClock = document.getElementById('chessClock');
    chessClock.style.display = 'flex';

    if (botDifficulty !== 'none') {
        document.getElementById('blackClockContainer').style.display = 'none';
    }

    updateChessClockDisplay();

    timerInterval = setInterval(() => {
        if (chessGame.currentTurnTime !== null) {
            chessGame.currentTurnTime++;

            const playerKey = chessGame.gameState.currentTurn === 'white' 
                ? 'currentWhiteTime' 
                : 'currentBlackTime';
            
            document.getElementById(playerKey).textContent = formatTime(chessGame.currentTurnTime);
            updateChessClockActive();
        }
    }, 1000);
}

/**
 * Stop the timer
 */
function stopTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    // Accumulate time for current turn before switching
    if (chessGame.currentTurnTime !== null && chessGame.gameActive) {
        const playerKey = chessGame.gameState.currentTurn === 'white' ? 'black' : 'white';
        chessGame.currentTime[playerKey] += chessGame.currentTurnTime;

        // Update total time displays
        document.getElementById('totalWhiteTime').textContent = formatTime(chessGame.currentTime.white);
        document.getElementById('totalBlackTime').textContent = formatTime(chessGame.currentTime.black);
    }

    chessGame.currentTurnTime = null;
}

/**
 * Update chess clock display
 */
function updateChessClockDisplay() {
    if (timerInterval) {
        const whiteTotal = chessGame.currentTime.white + 
            (chessGame.gameState.currentTurn === 'white' ? chessGame.currentTurnTime : 0);
        
        const blackTotal = chessGame.currentTime.black + 
            (chessGame.gameState.currentTurn === 'black' ? chessGame.currentTurnTime : 0);

        document.getElementById('totalWhiteTime').textContent = formatTime(whiteTotal);
        document.getElementById('totalBlackTime').textContent = formatTime(blackTotal);
    }
}

/**
 * Update active player highlight on clock
 */
function updateChessClockActive() {
    const whiteDisplay = document.getElementById('whiteTimeDisplay');
    const blackDisplay = document.getElementById('blackTimeDisplay');

    if (chessGame.gameState.currentTurn === 'white') {
        whiteDisplay.classList.add('active');
        blackDisplay.classList.remove('active');
    } else {
        blackDisplay.classList.add('active');
        whiteDisplay.classList.remove('active');
    }
}

// ============================================
// Persistence Functions
// ============================================

const STORAGE_KEY = 'chessGame';

/**
 * Auto-save to localStorage
 */
async function autoSave() {
    const state = {
        board: chessGame.board.copyGrid(),
        gameState: {
            currentTurn: chessGame.gameState.currentTurn,
            enPassantTarget: chessGame.gameState.enPassantTarget,
            castlingRights: { ...chessGame.gameState.castlingRights },
            whiteKingPos: { ...chessGame.gameState.whiteKingPos },
            blackKingPos: { ...chessGame.gameState.blackKingPos }
        },
        selectedSquare: chessGame.selectedSquare,
        legalMoves: chessGame.legalMoves,
        moveHistory: chessGame.moveHistory,
        gameActive: chessGame.gameActive,
        lastMove: chessGame.lastMove,
        botDifficulty: botDifficulty,
        currentTime: { ...chessGame.currentTime },
        currentTurnTime: chessGame.currentTurnTime
    };

    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/**
 * Save game to file
 */
async function saveGame() {
    const state = await getGameState();
    
    const jsonString = JSON.stringify(state, null, 2);
    const blob = new Blob([jsonString], { type: 'application/json' });
    const url = URL.createObjectURL(blob);

    const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
    const fileName = `chess-game-${timestamp}.json`;

    // Use File System Access API if available
    if (window.showSaveFilePicker) {
        try {
            const handle = await window.showSaveFilePicker({
                suggestedName: fileName,
                types: [{ description: 'Chess Game', accept: { 'application/json': ['.json'] } }]
            });
            
            const writable = await handle.createWritable();
            await writable.write(blob);
            await writable.close();
            
            URL.revokeObjectURL(url);
            return;
        } catch (err) {
            // User canceled or API not available, fall back to blob download
        }
    }

    // Fallback: blob download
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    
    URL.revokeObjectURL(url);
}

/**
 * Load game from file
 */
async function loadGame() {
    if (window.showOpenFilePicker) {
        try {
            const handles = await window.showOpenFilePicker({
                multiple: false,
                types: [{ description: 'Chess Game', accept: { 'application/json': ['.json'] } }]
            });
            
            if (handles.length > 0) {
                const handle = handles[0];
                const file = await handle.getFile();
                const text = await file.text();
                
                loadFromSaved(text);
                renderBoard();
                renderMoveHistory();
                updateStatus();
            }
        } catch (err) {
            // User canceled or API error
        }
        
        return;
    }

    // Fallback: create temporary file input
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    
    input.onchange = async (e) => {
        const file = e.target.files[0];
        
        if (file) {
            const text = await file.text();
            loadFromSaved(text);
            
            renderBoard();
            renderMoveHistory();
            updateStatus();
        }
    };
    
    input.click();
}

/**
 * Load game from localStorage
 */
function loadFromLocalStorage() {
    const saved = localStorage.getItem(STORAGE_KEY);
    
    if (saved) {
        loadFromSaved(saved);
        renderBoard();
        renderMoveHistory();
        updateStatus();
    } else {
        chessGame.init(botDifficulty);
        
        // Show black clock for human vs human mode
        document.getElementById('blackClockContainer').style.display = 'block';
        
        if (botDifficulty === 'none') {
            startTimer();
        }
    }
}

/**
 * Load game from saved data string
 */
function loadFromSaved(savedData) {
    const state = JSON.parse(savedData);
    
    // Reconstruct board with Piece objects
    chessGame.board.grid = state.board.map(row => 
        row.map(pieceData => pieceData ? createPiece(pieceData.type, pieceData.color) : null)
    );
    
    // Reconstruct game state
    chessGame.gameState.currentTurn = state.gameState.currentTurn;
    chessGame.gameState.enPassantTarget = state.gameState.enPassantTarget;
    chessGame.gameState.castlingRights = { ...state.gameState.castlingRights };
    chessGame.gameState.whiteKingPos = { ...state.gameState.whiteKingPos };
    chessGame.gameState.blackKingPos = { ...state.gameState.blackKingPos };
    
    // Restore other state
    chessGame.selectedSquare = state.selectedSquare;
    chessGame.legalMoves = state.legalMoves;
    chessGame.moveHistory = state.moveHistory;
    chessGame.gameActive = state.gameActive;
    chessGame.lastMove = state.lastMove;
    
    botDifficulty = state.botDifficulty !== undefined ? state.botDifficulty : 'medium';
    chessGame.currentTime = { ...state.currentTime };
    chessGame.currentTurnTime = null;
    
    stopTimer();
}

/**
 * Get current game state
 */
function getGameState() {
    return {
        board: chessGame.board.copyGrid(),
        gameState: {
            currentTurn: chessGame.gameState.currentTurn,
            enPassantTarget: chessGame.gameState.enPassantTarget,
            castlingRights: { ...chessGame.gameState.castlingRights },
            whiteKingPos: { ...chessGame.gameState.whiteKingPos },
            blackKingPos: { ...chessGame.gameState.blackKingPos }
        },
        selectedSquare: chessGame.selectedSquare,
        legalMoves: chessGame.legalMoves,
        moveHistory: chessGame.moveHistory,
        gameActive: chessGame.gameActive,
        lastMove: chessGame.lastMove,
        botDifficulty: botDifficulty,
        currentTime: { ...chessGame.currentTime },
        currentTurnTime: chessGame.currentTurnTime
    };
}

// ============================================
// Initialization and Event Listeners
// ============================================

/**
 * Setup event listeners
 */
function setupEventListeners() {
    // New Game button (MCP-ready ID)
    document.getElementById('mcp-btn-new-game').addEventListener('click', async () => {
        const confirmed = await chessGame.dialog.showConfirm(
            'Start a new game? Current progress will be lost.',
            'New Game'
        );
        
        if (confirmed) {
            await chessGame.createNewGame();
            
            // Show black clock for human vs human mode
            document.getElementById('blackClockContainer').style.display = 
                botDifficulty === 'none' ? 'block' : 'none';
            
            if (botDifficulty === 'none') {
                startTimer();
            }
        }
    });

    // Save Game button (MCP-ready ID)
    document.getElementById('mcp-btn-save-game').addEventListener('click', saveGame);

    // Load Game button (MCP-ready ID)
    document.getElementById('mcp-btn-load-game').addEventListener('click', loadGame);

    // Reset Position button (MCP-ready ID)
    document.getElementById('mcp-btn-reset-position').addEventListener('click', async () => {
        const confirmed = await chessGame.dialog.showConfirm(
            'Reset to starting position? Current moves will be lost.',
            'Reset Position'
        );
        
        if (confirmed) {
            await chessGame.resetToStartingPosition();
            
            // Show black clock for human vs human mode
            document.getElementById('blackClockContainer').style.display = 
                botDifficulty === 'none' ? 'block' : 'none';
        }
    });

    // Resize handle
    let isResizing = false;
    let startX, startWidth;

    const resizeHandle = document.getElementById('resizeHandle');
    
    resizeHandle.addEventListener('mousedown', (e) => {
        isResizing = true;
        startX = e.clientX;
        startWidth = document.querySelector('.board-panel').offsetWidth;
        
        document.body.style.cursor = 'col-resize';
        e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        
        const dx = e.clientX - startX;
        const newWidth = Math.max(300, Math.min(window.innerWidth - 350, startWidth + dx));
        
        document.querySelector('.board-panel').style.flex = `0 0 ${newWidth}px`;
    });

    document.addEventListener('mouseup', () => {
        isResizing = false;
        document.body.style.cursor = '';
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            deselectAll();
        } else if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            saveGame();
        } else if (e.key === 'l' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            loadGame();
        } else if (e.key === 'n' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            
            chessGame.dialog.showConfirm('Start a new game?', 'New Game')
                .then(confirmed => {
                    if (confirmed) {
                        chessGame.createNewGame();
                        
                        document.getElementById('blackClockContainer').style.display = 
                            botDifficulty === 'none' ? 'block' : 'none';
                        
                        if (botDifficulty === 'none') {
                            startTimer();
                        }
                    }
                });
        }
    });

    // Bot difficulty dropdown (MCP-ready ID)
    const blackClockContainer = document.getElementById('blackClockContainer');
    
    document.getElementById('mcp-bot-difficulty-select').addEventListener('change', async (e) => {
        botDifficulty = e.target.value;
        
        if (botDifficulty !== 'none') {
            blackClockContainer.style.display = 'none';
        } else {
            blackClockContainer.style.display = 'block';
            
            // Start timer for human vs human mode
            startTimer();
        }
        
        await autoSave();
    });
}

/**
 * Initialize the game
 */
async function init() {
    console.log('[INIT] Starting initialization...');
    setupEventListeners();
    
    console.log('[INIT] Calling chessGame.init...');
    await chessGame.init(botDifficulty);
    console.log('[INIT] chessGame.init completed');
    
    document.getElementById('blackClockContainer').style.display = 
        botDifficulty === 'none' ? 'block' : 'none';
    
    if (botDifficulty === 'none') {
        startTimer();
    }
}

// Start the game - Create a single shared board first, then use it for all components
const initAsync = async () => {
    console.log('[INITASYNC] Starting initialization...');
    
    try {
        const sharedBoard = new ChessBoard();  // Single shared board instance
        window.board = sharedBoard;  // Set global board reference
        
        console.log('[INITASYNC] Created shared board');
        
        // Now create chessGame with shared board
        chessGame = new ChessGame();
        window.chessGame = chessGame;  // Also expose via window for external access
        
        console.log('[INITASYNC] Created chessGame, calling init()...');
        await init();
        console.log('[INITASYNC] Initialization complete');
    } catch (e) {
        console.error('[INITASYNC] Error:', e);
    }
};
initAsync();
