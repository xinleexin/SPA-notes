<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPA Chess</title>
    <link rel="stylesheet" href="chess.css?v=4">
</head>
<body>
    <noscript><p style="text-align: center; padding: 20px;">SPA Chess requires JavaScript to run.</p></noscript>
    <h1>♟️ SPA Chess</h1>

    <div class="main-container">
        <main class="panel board-panel">
            <div id="mcp-board-grid-8x8" role="grid"></div>
            <div id="mcp-status-display">White's turn</div>
        </main>
        <div class="resize-handle" id="resizeHandle"></div>
        <div class="panel history-panel">
            <div id="chessClock" class="chess-clock">
                <div class="chess-clock-players">
                    <div class="player-time white active" id="whiteTimeDisplay"><span class="player-name">White</span><span id="currentWhiteTime" class="time-display">00:00</span></div>
                    <div id="blackClockContainer">
                        <div class="player-time black" id="blackTimeDisplay"><span class="player-name">Black</span><span id="currentBlackTime" class="time-display">00:00</span></div>
                    </div>
                </div>
                <div class="player-time clock-total"><span class="player-name">Total</span><span id="currentTotalTime" class="time-display">00:00</span></div>
            </div>

            <h3>Move History</h3>
            <div id="mcp-move-history-list">
                <p class="history-empty">No moves yet</p>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="mcp-btn-new-game">New Game</button>
                <button class="btn btn-secondary" id="mcp-btn-save-game">Save Game</button>
                <button class="btn btn-secondary" id="mcp-btn-load-game">Load Game</button>
                <button class="btn btn-danger" id="mcp-btn-reset-position" disabled>Take Back</button>
            </div>

            <div class="bot-settings-panel" id="mcp-bot-settings-panel">
                <label class="bot-settings-label" for="mcp-bot-difficulty-select">Bot Difficulty</label>
                <select class="bot-settings-select" id="mcp-bot-difficulty-select">
                    <option value="none">No Bot (Human vs Human)</option>
                    <option value="easy">Easy (Random)</option>
                    <option value="medium" selected>Medium (2-ply)</option>
                    <option value="hard">Hard (Iterative deepening, off-thread)</option>
                </select>
            </div>
        </div>
    </div>

<script src="chess-core.js?v=4"></script>
<script src="bot-ai.js?v=4"></script>
<script src="bot-ai-evaluation.js?v=4"></script>
<script src="bot-ai-engine.js?v=4"></script>
<script src="bot-ai-moves.js?v=4"></script>
<script src="chess.js?v=4"></script>
<script src="chess-ui-render.js?v=4"></script>
<script src="chess-ui-persistence.js?v=4"></script>
<script src="chess-ui.js?v=4"></script>
</body>
</html>
