<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPA Chess</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            padding: 10px;
            background: #2c3e50;
            color: white;
            font-size: 1.5rem;
        }

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
        }

        .panel {
            padding: 15px;
            overflow-y: auto;
        }

        .board-panel {
            flex: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ecf0f1;
            padding: 20px;
        }

        .resize-handle {
            width: 5px;
            background: #bdc3c7;
            cursor: col-resize;
            transition: background 0.2s;
            position: relative;
        }

        .resize-handle:hover {
            background: #7f8c8d;
        }

        .history-panel {
            flex: 1;
            min-width: 250px;
            max-width: 300px;
            background: #fff;
            border-left: 1px solid #bdc3c7;
        }

        /* Chess Board */
        #chessBoard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 12px solid #5d4037;
            user-select: none;
            max-width: 126vh;
            max-height: 126vh;
            aspect-ratio: 1 / 1;
            box-shadow:
                inset 4px 4px 8px rgba(255, 255, 255, 0.3),
                inset -4px -4px 8px rgba(0, 0, 0, 0.4),
                10px 10px 30px rgba(0, 0, 0, 0.5);
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(22px, 8vh, 64px);
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s ease;
        }

        /* White squares - warm wood-like color */
        .square.white {
            background: linear-gradient(135deg, #f0e6d2 0%, #e8dcc5 100%);
            box-shadow:
                inset 1px 1px 0 rgba(255, 255, 255, 0.4),
                inset -1px -1px 0 rgba(0, 0, 0, 0.08);
        }

        /* Black squares - dark walnut color */
        .square.black {
            background: linear-gradient(135deg, #795548 0%, #6d4c41 100%);
            box-shadow:
                inset 1px 1px 0 rgba(255, 255, 255, 0.1),
                inset -1px -1px 0 rgba(0, 0, 0, 0.3);
        }

        .square.selected {
            background: linear-gradient(135deg, #f1c40f 0%, #d4ac0d 100%) !important;
            box-shadow:
                inset 2px 2px 8px rgba(255, 255, 255, 0.6),
                0 0 15px rgba(241, 196, 15, 0.7);
            animation: pulseSelected 1.5s infinite ease-in-out;
        }

        .square.legal-move {
            cursor: pointer;
        }

        .square.legal-move::after {
            content: '';
            position: absolute;
            width: clamp(8px, 2vh, 16px);
            height: clamp(8px, 2vh, 16px);
            background: radial-gradient(circle at center, rgba(46, 204, 113, 0.9) 0%, rgba(46, 204, 113, 0.5) 70%, transparent 100%);
            border-radius: 50%;
            box-shadow:
                inset 1px 1px 2px rgba(255, 255, 255, 0.3),
                0 0 8px rgba(46, 204, 113, 0.5);
        }

        @keyframes pulseSelected {
            0%, 100% { box-shadow: inset 2px 2px 8px rgba(255, 255, 255, 0.6), 0 0 15px rgba(241, 196, 15, 0.7); }
            50% { box-shadow: inset 3px 3px 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(241, 196, 15, 0.9); }
        }

        .square.last-move {
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%) !important;
            box-shadow:
                inset 1px 1px 8px rgba(255, 255, 255, 0.4),
                0 0 12px rgba(230, 126, 34, 0.5);
        }

        .square.in-check {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%) !important;
            box-shadow:
                inset 2px 2px 8px rgba(255, 255, 255, 0.3),
                0 0 20px rgba(231, 76, 60, 0.8);
        }

        
        /* Piece styling - 3D effect */
        .piece {
            cursor: grab;
            z-index: 1;
            display: inline-block;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        /* White pieces - crisp white with clean outer shadow for depth */
        .piece.white {
            color: #ffffff;
            text-shadow:
                /* Sharp edges - tight shadows only on one side */
                2px 2px 3px rgba(0, 0, 0, 0.4),
                5px 8px 15px rgba(0, 0, 0, 0.5);
            filter: drop-shadow(4px 6px 8px rgba(0, 0, 0, 0.3));
        }

        /* Black pieces - 3D polished black look with subtle sheen */
        .piece.black {
            color: #0a0b0d;
            text-shadow:
                /* Inner highlight for depth */
                1px 1px 2px rgba(255, 255, 255, 0.4),
                /* Mid-level gradient shadows */
                -1px -1px 0 #3a3b40,
                2px 2px 0 #2d2e33,
                /* Deep outer shadow for floating effect */
                4px 6px 8px rgba(0, 0, 0, 0.7),
                10px 15px 25px rgba(0, 0, 0, 0.5);
        }

        /* Hover effect - lift pieces up and add glow */
        .piece:hover {
            transform: scale(1.1) translateY(-3px);
            filter: brightness(1.15) drop-shadow(8px 12px 16px rgba(0, 0, 0, 0.4));
            z-index: 10;
        }

        /* Game Status */
        #gameStatus {
            margin-top: 15px;
            padding: 10px 20px;
            background: #34495e;
            color: white;
            border-radius: 5px;
            font-size: 1.2rem;
        }

        /* Move History */
        .history-panel h3 {
            padding-bottom: 10px;
            border-bottom: 1px solid #bdc3c7;
            color: #2c3e50;
        }

        #moveHistoryList {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .history-row {
            display: flex;
            padding: 5px 10px;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }

        .history-row:nth-child(odd) {
            background: #f8f9fa;
        }

        .history-index {
            width: 30px;
            color: #7f8c8d;
        }

        .history-move {
            flex: 1;
            font-family: monospace;
        }

        /* Buttons */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        /* Coordinates */
        .coord-rank {
            position: absolute;
            left: 2px;
            top: 2px;
            font-size: 10px;
            color: #7f8c8d;
        }

        .coord-file {
            position: absolute;
            right: 2px;
            bottom: 2px;
            font-size: 10px;
            color: #7f8c8d;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .resize-handle {
                width: 100%;
                height: 5px;
                cursor: row-resize;
            }

            .history-panel {
                max-width: 100%;
                min-height: 200px;
            }

            .board-panel {
                flex: 1;
            }
        }

        /* Chess Clock Display */
        .chess-clock {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 15px;
            background: #ecf0f1;
            border-radius: 8px;
            font-family: monospace;
        }

        .player-time {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px;
            min-width: 60px;
            background: #fff;
            border-radius: 4px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
        }

        .player-time.white {
            border-bottom: 3px solid #ecf0f1;
        }

        .player-time.black {
            border-top: 3px solid #95a5a6;
        }

        .player-name {
            font-size: 0.8rem;
            color: #7f8c8d;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .time-display {
            font-size: 1.3rem;
            color: #2c3e50;
            font-weight: bold;
        }

        .player-time.active {
            background: linear-gradient(135deg, #f1c40f 0%, #d4ac0d 100%);
            box-shadow:
                inset 2px 2px 8px rgba(255, 255, 255, 0.6),
                0 0 10px rgba(241, 196, 15, 0.7);
        }

        .player-time.active.white {
            border-bottom-color: #f1c40f;
        }

        .player-time.active.black {
            border-top-color: #d4ac0d;
        }
    </style>
</head>
<body>
    <h1>♟️ SPA Chess</h1>

    <div class="main-container">
        <div class="panel board-panel">
            <div id="chessBoard"></div>
            <div id="gameStatus">White's turn</div>
        </div>

        <div class="resize-handle" id="resizeHandle"></div>

        <div class="panel history-panel">
            <h3>Move History</h3>
            <!-- Chess Clock Display -->
            <div id="chessClock" class="chess-clock" style="display: none;">
                <div id="whiteTimeDisplay" class="player-time white active">
                    <span class="player-name">White</span>
                    <span id="currentWhiteTime" class="time-display">00:00</span>
                    <span id="totalWhiteTime" class="time-display" style="font-size: 1rem; margin-top: 4px;">00:00</span>
                </div>
                <!-- Hide black clock when playing against bot -->
                <div id="blackClockContainer">
                    <div id="blackTimeDisplay" class="player-time black">
                        <span class="player-name">Black</span>
                        <span id="currentBlackTime" class="time-display">00:00</span>
                        <span id="totalBlackTime" class="time-display" style="font-size: 1rem; margin-top: 4px;">00:00</span>
                    </div>
                </div>
            </div>

            <h3>Move History</h3>
            <div id="moveHistoryList">
                <p style="color: #7f8c8d; text-align: center; padding: 20px;">No moves yet</p>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="newGameBtn">New Game</button>
                <button class="btn btn-secondary" id="saveGameBtn">Save Game</button>
                <button class="btn btn-secondary" id="loadGameBtn">Load Game</button>
                <button class="btn btn-danger" id="resetGameBtn">Reset Position</button>
            </div>

            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #bdc3c7;">
                <label for="botDifficultySelect" style="display: block; margin-bottom: 5px; color: #2c3e50; font-weight: 600;">
                    Bot Difficulty
                </label>
                <select id="botDifficultySelect" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #bdc3c7; font-size: 0.9rem;">
                    <option value="none">No Bot (Human vs Human)</option>
                    <option value="easy">Easy (Random)</option>
                    <option value="medium" selected>Medium (2-ply)</option>
                    <option value="hard">Hard (3-ply)</option>
                </select>
                <p style="font-size: 0.8rem; color: #7f8c8d; margin-top: 5px;">
                    Select difficulty or "No Bot" for human vs human
                </p>
            </div>
        </div>
    </div>

    <script>
// ============================================
        // Chess Game SPA - State Management
        // ============================================

        // Board: 8x8 array where each cell is {type, color} or null
        let board = [];
        let currentTurn = 'white';
        let selectedSquare = null;
        let legalMoves = [];
        let moveHistory = [];
        let gameActive = true;
        let enPassantTarget = null; // {row, col} or null
        let castlingRights = {
            whiteKingMoved: false,
            blackKingMoved: false,
            whiteRookKingSideMoved: false,  // h1
            whiteRookQueenSideMoved: false, // a1
            blackRookKingSideMoved: false,  // h8
            blackRookQueenSideMoved: false  // a8
        };
        let lastMove = null; // {from: {row, col}, to: {row, col}}
        let whiteKingPos = {row: 7, col: 4};
        let blackKingPos = {row: 0, col: 4};
        let botDifficulty = 'medium'; // 'easy', 'medium', 'hard', or 'none'

        // Move Timer State
        let currentTime = { white: 0, black: 0 }; // Accumulated time per player (in seconds)
        let currentTurnTime = null; // Seconds for current turn (counting up)
        let timerInterval = null; // setInterval reference

        // DOM Elements

        // DOM Elements
        const chessBoard = document.getElementById('chessBoard');
        const gameStatus = document.getElementById('gameStatus');
        const moveHistoryList = document.getElementById('moveHistoryList');
        const resizeHandle = document.getElementById('resizeHandle');

        // Unicode Chess Pieces
        const PIECES = {
            white: { k: '♔', q: '♕', r: '♖', b: '♗', n: '♘', p: '♙' },
            black: { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' }
        };

        // Helper for rendering coordinates
        // Files (columns): a-h from left to right
        // Ranks (rows): 1-8 from white to black (white side = smaller row numbers)
        const columns = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        // Row 0 is rank "8" (black back rank), row 7 is rank "1" (white front rank)
        const rows = ['8', '7', '6', '5', '4', '3', '2', '1'];

        // ============================================
        // Initialization
        // ============================================

        function init() {
            loadFromLocalStorage();
            setupEventListeners();
            renderBoard();
            updateStatus();
            // Start timer for the game
            if (botDifficulty === 'none') {
                startTimer();
            } else {
                // Hide black clock when playing against bot
                document.getElementById('blackClockContainer').style.display = 'none';
            }
            renderMoveHistory();
        }

        function setupEventListeners() {
            // New Game
            document.getElementById('newGameBtn').addEventListener('click', () => {
                if (confirm('Start a new game? Current progress will be lost.')) {
                    createNewGame();
                }
            });

            // Save Game
            document.getElementById('saveGameBtn').addEventListener('click', saveGame);

            // Load Game
            document.getElementById('loadGameBtn').addEventListener('click', loadGame);

            // Reset Position
            document.getElementById('resetGameBtn').addEventListener('click', () => {
                if (confirm('Reset to starting position? Current moves will be lost.')) {
                    resetToStartingPosition();
                }
            });

            // Resize handle
            let isResizing = false;
            let startX, startWidth;

            resizeHandle.addEventListener('mousedown', (e) => {
                isResizing = true;
                startX = e.clientX;
                startWidth = document.querySelector('.board-panel').offsetWidth;
                document.body.style.cursor = 'col-resize';
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const dx = e.clientX - startX;
                const newWidth = Math.max(300, Math.min(window.innerWidth - 350, startWidth + dx));
                document.querySelector('.board-panel').style.flex = `0 0 ${newWidth}px`;
            });

            document.addEventListener('mouseup', () => {
                isResizing = false;
                document.body.style.cursor = '';
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    deselectAll();
                } else if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    saveGame();
                } else if (e.key === 'l' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    loadGame();
                } else if (e.key === 'n' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    if (confirm('Start a new game?')) createNewGame();
                }
            });

            // Bot difficulty dropdown
            const blackClockContainer = document.getElementById('blackClockContainer');
            document.getElementById('botDifficultySelect').addEventListener('change', (e) => {
                botDifficulty = e.target.value;
                // Hide black clock when playing against bot, show it for human vs human
                if (botDifficulty !== 'none') {
                    blackClockContainer.style.display = 'none';
                } else {
                    blackClockContainer.style.display = 'block';
                }
                autoSave();
            });
        }

        function createNewGame() {
            board = initializeBoard();
            currentTurn = 'white';
            selectedSquare = null;
            legalMoves = [];
            moveHistory = [];
            gameActive = true;
            enPassantTarget = null;
            castlingRights = {
                whiteKingMoved: false,
                blackKingMoved: false,
                whiteRookKingSideMoved: false,
                whiteRookQueenSideMoved: false,
                blackRookKingSideMoved: false,
                blackRookQueenSideMoved: false
            };
            lastMove = null;
            whiteKingPos = {row: 7, col: 4};
            blackKingPos = {row: 0, col: 4};

            // Reset timer state
            currentTime = { white: 0, black: 0 };
            currentTurnTime = null;
            stopTimer();

            // Hide black clock when playing against bot
            const blackClockContainer = document.getElementById('blackClockContainer');
            if (botDifficulty !== 'none') {
                blackClockContainer.style.display = 'none';
            } else {
                blackClockContainer.style.display = 'block';
            }

            // Start timer for human vs human mode (No Bot)
            if (botDifficulty === 'none') {
                startTimer();
            }

            autoSave();
            renderBoard();
            renderMoveHistory();
            updateStatus();
        }

        function resetToStartingPosition() {
            board = initializeBoard();
            enPassantTarget = null;
            castlingRights = {
                whiteKingMoved: false,
                blackKingMoved: false,
                whiteRookKingSideMoved: false,
                whiteRookQueenSideMoved: false,
                blackRookKingSideMoved: false,
                blackRookQueenSideMoved: false
            };
            lastMove = null;
            whiteKingPos = {row: 7, col: 4};
            blackKingPos = {row: 0, col: 4};

            // Reset timer state
            currentTime = { white: 0, black: 0 };
            currentTurnTime = null;
            stopTimer();

            // Hide black clock when playing against bot
            const blackClockContainer2 = document.getElementById('blackClockContainer');
            if (botDifficulty !== 'none') {
                blackClockContainer2.style.display = 'none';
            } else {
                blackClockContainer2.style.display = 'block';
            }

            autoSave();
            renderBoard();
        }

        function initializeBoard() {
            const newBoard = Array(8).fill(null).map(() => Array(8).fill(null));

            // Black pieces (row 0-1)
            newBoard[0] = [
                {type: 'r', color: 'black'}, {type: 'n', color: 'black'}, {type: 'b', color: 'black'},
                {type: 'q', color: 'black'}, {type: 'k', color: 'black'}, {type: 'b', color: 'black'},
                {type: 'n', color: 'black'}, {type: 'r', color: 'black'}
            ];
            newBoard[1] = Array(8).fill({type: 'p', color: 'black'});

            // White pieces (row 6-7)
            newBoard[6] = Array(8).fill({type: 'p', color: 'white'});
            newBoard[7] = [
                {type: 'r', color: 'white'}, {type: 'n', color: 'white'}, {type: 'b', color: 'white'},
                {type: 'q', color: 'white'}, {type: 'k', color: 'white'}, {type: 'b', color: 'white'},
                {type: 'n', color: 'white'}, {type: 'r', color: 'white'}
            ];

            return newBoard;
        }

        // ============================================
        // Move Validation Logic
        // ============================================

        function getPiece(row, col) {
            if (!isSquareValid(row, col)) return null;
            return board[row][col];
        }

        function isSquareValid(row, col) {
            return row >= 0 && row < 8 && col >= 0 && col < 8;
        }

        function isOwnPiece(row, col, color) {
            const piece = getPiece(row, col);
            return piece && piece.color === color;
        }

        function isEmpty(row, col) {
            return getPiece(row, col) === null;
        }

        function isOpponentPiece(row, col, color) {
            const piece = getPiece(row, col);
            return piece && piece.color !== color;
        }

        // Check if a square is under attack by opponent
        function isSquareUnderAttack(row, col, attackerColor) {
            // Check pawn attacks
            const pawnDirection = attackerColor === 'white' ? -1 : 1;
            const pawnAttackerRow = row + pawnDirection;
            if (isSquareValid(pawnAttackerRow, col - 1)) {
                const piece = getPiece(pawnAttackerRow, col - 1);
                if (piece && piece.color === attackerColor && piece.type === 'p') {
                    return true;
                }
            }
            if (isSquareValid(pawnAttackerRow, col + 1)) {
                const piece = getPiece(pawnAttackerRow, col + 1);
                if (piece && piece.color === attackerColor && piece.type === 'p') {
                    return true;
                }
            }

            // Check knight attacks
            const knightMoves = [
                {dr: -2, dc: -1}, {dr: -2, dc: 1}, {dr: -1, dc: -2}, {dr: -1, dc: 2},
                {dr: 1, dc: -2}, {dr: 1, dc: 2}, {dr: 2, dc: -1}, {dr: 2, dc: 1}
            ];
            for (const move of knightMoves) {
                if (isSquareValid(row + move.dr, col + move.dc)) {
                    const piece = getPiece(row + move.dr, col + move.dc);
                    if (piece && piece.color === attackerColor && piece.type === 'n') {
                        return true;
                    }
                }
            }

            // Check king attacks (adjacent squares)
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    if (isSquareValid(row + dr, col + dc)) {
                        const piece = getPiece(row + dr, col + dc);
                        if (piece && piece.color === attackerColor && piece.type === 'k') {
                            return true;
                        }
                    }
                }
            }

            // Check sliding pieces (rook, bishop, queen)
            const directions = [
                {dr: -1, dc: 0}, {dr: 1, dc: 0}, {dr: 0, dc: -1}, {dr: 0, dc: 1}, // Rook/Queen
                {dr: -1, dc: -1}, {dr: -1, dc: 1}, {dr: 1, dc: -1}, {dr: 1, dc: 1} // Bishop/Queen
            ];

            for (let i = 0; i < directions.length; i++) {
                const d = directions[i];
                let r = row + d.dr;
                let c = col + d.dc;
                let distance = 0;

                while (isSquareValid(r, c)) {
                    distance++;
                    const piece = getPiece(r, c);

                    if (piece) {
                        if (piece.color === attackerColor) {
                            const isRookLike = i < 4;
                            if (piece.type === 'q' || (isRookLike && piece.type === 'r') || (!isRookLike && piece.type === 'b')) {
                                return true;
                            }
                            // Special case: king one square away
                            if (piece.type === 'k' && distance === 1) {
                                return true;
                            }
                        }
                        break; // Blocked by any piece
                    }
                    r += d.dr;
                    c += d.dc;
                }
            }

            return false;
        }

        // Find all pseudo-legal moves (before filtering for king safety)
        function getPseudoLegalMoves(row, col) {
            const piece = getPiece(row, col);
            if (!piece) return [];

            const moves = [];
            const color = piece.color;
            const opponentColor = color === 'white' ? 'black' : 'white';

            switch (piece.type) {
                case 'p':
                    // Pawn moves
                    const direction = color === 'white' ? -1 : 1;
                    const startRow = color === 'white' ? 6 : 1;
                    const lastRow = color === 'white' ? 0 : 7;

                    // Forward move
                    if (isEmpty(row + direction, col)) {
                        if (row + direction === lastRow) {
                            moves.push({row: row + direction, col: col, isPromotion: true});
                        } else {
                            moves.push({row: row + direction, col: col});
                        }

                        // Double move from starting position
                        if (row === startRow && isEmpty(row + direction * 2, col)) {
                            moves.push({row: row + direction * 2, col: col, isDoublePawn: true});
                        }
                    }

                    // Captures
                    const captureOffsets = [-1, 1];
                    for (const offset of captureOffsets) {
                        const targetRow = row + direction;
                        const targetCol = col + offset;

                        if (isSquareValid(targetRow, targetCol)) {
                            // Normal capture
                            if (isOpponentPiece(targetRow, targetCol, color)) {
                                if (targetRow === lastRow) {
                                    moves.push({row: targetRow, col: targetCol, isPromotion: true});
                                } else {
                                    moves.push({row: targetRow, col: targetCol});
                                }
                            }
                            // En passant capture
                            else if (enPassantTarget &&
                                     enPassantTarget.row === targetRow &&
                                     enPassantTarget.col === targetCol) {
                                moves.push({row: targetRow, col: targetCol, isEnPassant: true});
                            }
                        }
                    }
                    break;

                case 'n':
                    // Knight moves (L-shape)
                    const knightMoves = [
                        {dr: -2, dc: -1}, {dr: -2, dc: 1}, {dr: -1, dc: -2}, {dr: -1, dc: 2},
                        {dr: 1, dc: -2}, {dr: 1, dc: 2}, {dr: 2, dc: -1}, {dr: 2, dc: 1}
                    ];
                    for (const move of knightMoves) {
                        const targetRow = row + move.dr;
                        const targetCol = col + move.dc;
                        if (isSquareValid(targetRow, targetCol)) {
                            if (isEmpty(targetRow, targetCol) || isOpponentPiece(targetRow, targetCol, color)) {
                                moves.push({row: targetRow, col: targetCol});
                            }
                        }
                    }
                    break;

                case 'b':
                case 'r':
                case 'q':
                    // Sliding pieces
                    const directions = [];
                    if (piece.type === 'b' || piece.type === 'q') {
                        directions.push({dr: -1, dc: -1}, {dr: -1, dc: 1}, {dr: 1, dc: -1}, {dr: 1, dc: 1});
                    }
                    if (piece.type === 'r' || piece.type === 'q') {
                        directions.push({dr: -1, dc: 0}, {dr: 1, dc: 0}, {dr: 0, dc: -1}, {dr: 0, dc: 1});
                    }

                    for (const d of directions) {
                        let r = row + d.dr;
                        let c = col + d.dc;
                        while (isSquareValid(r, c)) {
                            if (isEmpty(r, c)) {
                                moves.push({row: r, col: c});
                            } else if (isOpponentPiece(r, c, color)) {
                                moves.push({row: r, col: c});
                                break; // Stop after capturing
                            } else {
                                break; // Blocked by own piece
                            }
                            r += d.dr;
                            c += d.dc;
                        }
                    }
                    break;

                case 'k':
                    // King moves (one square in any direction)
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            const targetRow = row + dr;
                            const targetCol = col + dc;
                            if (isSquareValid(targetRow, targetCol)) {
                                if (isEmpty(targetRow, targetCol) || isOpponentPiece(targetRow, targetCol, color)) {
                                    // King cannot move into check
                                    if (!isSquareUnderAttack(targetRow, targetCol, opponentColor)) {
                                        moves.push({row: targetRow, col: targetCol});
                                    }
                                }
                            }
                        }
                    }

                    // Castling (only if king hasn't moved and not in check)
                    if (!castlingRights[color === 'white' ? 'whiteKingMoved' : 'blackKingMoved'] &&
                        !isSquareUnderAttack(row, col, opponentColor)) {
                        const backRow = color === 'white' ? 7 : 0;
                        const kingSideRookMoved = color === 'white' ? castlingRights.whiteRookKingSideMoved : castlingRights.blackRookKingSideMoved;
                        const queenSideRookMoved = color === 'white' ? castlingRights.whiteRookQueenSideMoved : castlingRights.blackRookQueenSideMoved;

                        // King-side castling
                        if (!kingSideRookMoved && isEmpty(backRow, 5) && isEmpty(backRow, 6) &&
                            !isSquareUnderAttack(backRow, 5, opponentColor) &&
                            !isSquareUnderAttack(backRow, 6, opponentColor)) {
                            moves.push({row: backRow, col: 6, isCastling: 'kingside'});
                        }

                        // Queen-side castling
                        if (!queenSideRookMoved && isEmpty(backRow, 1) && isEmpty(backRow, 2) && isEmpty(backRow, 3) &&
                            !isSquareUnderAttack(backRow, 3, opponentColor) &&
                            !isSquareUnderAttack(backRow, 2, opponentColor)) {
                            moves.push({row: backRow, col: 2, isCastling: 'queenside'});
                        }
                    }
                    break;
            }

            return moves;
        }

        // Get fully legal moves (filtering out moves that leave king in check)
        function getLegalMoves(row, col) {
            const piece = getPiece(row, col);
            if (!piece || piece.color !== currentTurn) return [];

            const pseudoMoves = getPseudoLegalMoves(row, col);
            const legalMoves = [];

            for (const move of pseudoMoves) {
                // Simulate the move
                const savedTarget = board[move.row][move.col];
                const savedSource = board[row][col];

                board[move.row][move.col] = savedSource;
                board[row][col] = null;

                // Update king position if king moved
                let originalKingPos = null;
                let testKingPos = null;
                if (piece.type === 'k') {
                    originalKingPos = piece.color === 'white' ? whiteKingPos : blackKingPos;
                    testKingPos = piece.color === 'white' ? whiteKingPos : blackKingPos;
                    if (piece.color === 'white') whiteKingPos = {row: move.row, col: move.col};
                    else blackKingPos = {row: move.row, col: move.col};
                }

                // Check if king is in check after the move
                const opponentColor = piece.color === 'white' ? 'black' : 'white';
                const kingPos = piece.type === 'k' ? {row: move.row, col: move.col} : (piece.color === 'white' ? whiteKingPos : blackKingPos);
                const kingInCheck = isSquareUnderAttack(kingPos.row, kingPos.col, opponentColor);

                // Revert the move
                board[row][col] = savedSource;
                board[move.row][move.col] = savedTarget;

                if (piece.type === 'k' && originalKingPos) {
                    if (piece.color === 'white') whiteKingPos = originalKingPos;
                    else blackKingPos = originalKingPos;
                }

                if (!kingInCheck) {
                    // For castling, verify the rook path is clear
                    if (move.isCastling === 'kingside') {
                        const backRow = piece.color === 'white' ? 7 : 0;
                        if (isSquareUnderAttack(backRow, 5, opponentColor)) continue;
                    } else if (move.isCastling === 'queenside') {
                        const backRow = piece.color === 'white' ? 7 : 0;
                        if (isSquareUnderAttack(backRow, 3, opponentColor)) continue;
                    }

                    legalMoves.push(move);
                }
            }

            return legalMoves;
        }

        // ============================================
        // Check / Checkmate Detection
        // ============================================

        function findKing(color) {
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const piece = board[row][col];
                    if (piece && piece.type === 'k' && piece.color === color) {
                        return {row, col};
                    }
                }
            }
            return null;
        }

        function isCheck(color) {
            const kingPos = findKing(color);
            if (!kingPos) return false;
            const opponentColor = color === 'white' ? 'black' : 'white';
            return isSquareUnderAttack(kingPos.row, kingPos.col, opponentColor);
        }

        function hasLegalMoves(color) {
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const piece = board[row][col];
                    if (piece && piece.color === color) {
                        if (getLegalMoves(row, col).length > 0) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function isCheckmate() {
            return isCheck(currentTurn) && !hasLegalMoves(currentTurn);
        }

        function isStalemate() {
            return !isCheck(currentTurn) && !hasLegalMoves(currentTurn);
        }

        function isGameOver() {
            return isCheckmate() || isStalemate() || !findKing('white') || !findKing('black');
        }

        function checkKingCapture() {
            const whiteKing = findKing('white');
            const blackKing = findKing('black');
            if (!whiteKing) return 'black';
            if (!blackKing) return 'white';
            return null;
        }

        // ============================================
        // Move Execution
        // ============================================

        function selectSquare(row, col) {
            if (!gameActive) return;

            const piece = getPiece(row, col);

            // If selecting own piece
            if (piece && piece.color === currentTurn) {
                selectedSquare = {row, col};
                legalMoves = getLegalMoves(row, col);
                renderBoard();
                return;
            }

            // If a square is selected and clicking a legal move
            if (selectedSquare) {
                const move = legalMoves.find(m => m.row === row && m.col === col);
                if (move) {
                    executeMove(selectedSquare, move);
                    return;
                }
            }

            // Deselect if clicking elsewhere
            deselectAll();
        }

        function deselectAll() {
            selectedSquare = null;
            legalMoves = [];
            renderBoard();
        }

        function executeMove(from, to) {
            const piece = board[from.row][from.col];
            const targetPiece = board[to.row][to.col];
            const color = piece.color;

            // Handle en passant capture
            if (to.isEnPassant) {
                const captureRow = to.row; // Captured pawn is on the same row as destination
                const captureCol = to.col;
                board[captureRow][captureCol] = null;
            }

            // Handle castling - move rook
            if (to.isCastling === 'kingside') {
                const rookRow = from.row;
                const rookCol = 7;
                const newRookCol = 5;
                board[rookRow][newRookCol] = board[rookRow][rookCol];
                board[rookRow][rookCol] = null;
                if (color === 'white') castlingRights.whiteRookKingSideMoved = true;
                else castlingRights.blackRookKingSideMoved = true;
            } else if (to.isCastling === 'queenside') {
                const rookRow = from.row;
                const rookCol = 0;
                const newRookCol = 3;
                board[rookRow][newRookCol] = board[rookRow][rookCol];
                board[rookRow][rookCol] = null;
                if (color === 'white') castlingRights.whiteRookQueenSideMoved = true;
                else castlingRights.blackRookQueenSideMoved = true;
            }

            // Update castling rights for rooks
            if (piece.type === 'r') {
                if (color === 'white') {
                    // a1 (row 7, col 0) - queenside
                    if (from.row === 7 && from.col === 0) castlingRights.whiteRookQueenSideMoved = true;
                    // h1 (row 7, col 7) - kingside
                    if (from.row === 7 && from.col === 7) castlingRights.whiteRookKingSideMoved = true;
                } else {
                    // a8 (row 0, col 0) - queenside
                    if (from.row === 0 && from.col === 0) castlingRights.blackRookQueenSideMoved = true;
                    // h8 (row 0, col 7) - kingside
                    if (from.row === 0 && from.col === 7) castlingRights.blackRookKingSideMoved = true;
                }
            }

            // Update castling rights for king
            if (piece.type === 'k') {
                if (color === 'white') castlingRights.whiteKingMoved = true;
                else castlingRights.blackKingMoved = true;
            }

            // Move the piece
            board[to.row][to.col] = piece;
            board[from.row][from.col] = null;

            // Handle pawn promotion
            if (to.isPromotion) {
                const promotionPieces = ['q', 'r', 'b', 'n'];
                let promotionPiece = null;

                // Auto-promote for bot moves (when it's black's turn)
                if (color === 'black') {
                    promotionPiece = 'q'; // Default to queen for bot
                } else {
                    const choice = prompt('Choose promotion: Q, R, B, N', 'q');
                    if (choice && promotionPieces.includes(choice.toLowerCase())) {
                        promotionPiece = choice.toLowerCase();
                    } else {
                        promotionPiece = 'q'; // Default to queen
                    }
                }

                board[to.row][to.col] = { type: promotionPiece, color: color };
            }

            // Update king position
            if (piece.type === 'k') {
                if (color === 'white') whiteKingPos = {row: to.row, col: to.col};
                else blackKingPos = {row: to.row, col: to.col};
            }

            // Update en passant target
            if (to.isDoublePawn) {
                enPassantTarget = {row: (from.row + to.row) / 2, col: from.col};
            } else {
                enPassantTarget = null;
            }

            // Record the move
            recordMove(from, to, piece, targetPiece);

            // Update last move for highlighting
            lastMove = {from, to};

            // Check for king capture, checkmate, or stalemate
            const kingCaptured = checkKingCapture();
            if (kingCaptured) {
                gameActive = false;
                gameStatus.textContent = `${kingCaptured.charAt(0).toUpperCase() + kingCaptured.slice(1)} wins! (King captured)`;
                gameStatus.style.backgroundColor = '#e74c3c';
            } else if (isCheckmate()) {
                gameActive = false;
                updateStatus();
            } else if (isStalemate()) {
                gameActive = false;
                updateStatus();
            } else {
                // Switch turn
                currentTurn = currentTurn === 'white' ? 'black' : 'white';
                updateStatus();
            }

            // Save game state
            autoSave();
            deselectAll();
            renderMoveHistory();

            // Start timer for the new player (unless using bot)
            startTimer();

            // Trigger bot move if it's black's turn and not disabled
            if (currentTurn === 'black' && gameActive) {
                setTimeout(botMakeMove, 500);
            }
        }

        function recordMove(from, to, piece, captured) {
            const columns = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            // Row 0 is rank "8" (black back rank), row 7 is rank "1" (white front rank)
            const rows = ['8', '7', '6', '5', '4', '3', '2', '1'];

            let notation = '';
            if (piece.type !== 'p') {
                notation += piece.type.toUpperCase();
            }

            if (captured || to.isEnPassant) {
                if (piece.type === 'p') notation += columns[from.col];
                notation += '×';
            }

            notation += columns[to.col] + rows[to.row];

            // Add check/mate suffix
            const opponentColor = currentTurn === 'white' ? 'black' : 'white';
            if (isCheck(opponentColor)) {
                if (isCheckmate()) {
                    notation += '#';
                } else {
                    notation += '+';
                }
            }

            // Add castling notation
            if (to.isCastling === 'kingside') notation = 'O-O';
            if (to.isCastling === 'queenside') notation = 'O-O-O';

            moveHistory.push({
                turn: moveHistory.length + 1,
                color: piece.color,
                from: {row: from.row, col: from.col},
                to: {row: to.row, col: to.col},
                piece: piece,
                captured: captured,
                notation: notation
            });
        }

        // ============================================
        // UI Rendering
        // ============================================

        function renderBoard() {
            chessBoard.innerHTML = '';

            // Determine check status for king highlighting
            const kingInCheck = isCheck(currentTurn) && gameActive;
            const kingPos = kingInCheck ? findKing(currentTurn) : null;

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = `square ${(row + col) % 2 === 0 ? 'white' : 'black'}`;
                    square.dataset.row = row;
                    square.dataset.col = col;

                    // Highlight selected square
                    if (selectedSquare && selectedSquare.row === row && selectedSquare.col === col) {
                        square.classList.add('selected');
                    }

                    // Highlight legal moves
                    if (legalMoves.some(m => m.row === row && m.col === col)) {
                        square.classList.add('legal-move');
                    }

                    // Highlight last move
                    if (lastMove) {
                        if ((lastMove.from.row === row && lastMove.from.col === col) ||
                            (lastMove.to.row === row && lastMove.to.col === col)) {
                            square.classList.add('last-move');
                        }
                    }

                    // Highlight king in check
                    if (kingPos && kingPos.row === row && kingPos.col === col) {
                        square.classList.add('in-check');
                    }

                    // Add coordinates
                    if (col === 0) {
                        const rankCoord = document.createElement('span');
                        rankCoord.className = 'coord-rank';
                        rankCoord.textContent = rows[row];
                        square.appendChild(rankCoord);
                    }
                    if (row === 7) {
                        const fileCoord = document.createElement('span');
                        fileCoord.className = 'coord-file';
                        fileCoord.textContent = columns[col];
                        square.appendChild(fileCoord);
                    }

                    // Add piece
                    const piece = board[row][col];
                    if (piece) {
                        const pieceSpan = document.createElement('span');
                        pieceSpan.className = `piece ${piece.color}`;
                        pieceSpan.textContent = PIECES[piece.color][piece.type];
                        square.appendChild(pieceSpan);
                    }

                    square.addEventListener('click', () => selectSquare(row, col));
                    chessBoard.appendChild(square);
                }
            }
        }

        function renderMoveHistory() {
            moveHistoryList.innerHTML = '';

            if (moveHistory.length === 0) {
                moveHistoryList.innerHTML = '<p style="color: #7f8c8d; text-align: center; padding: 20px;">No moves yet</p>';
                return;
            }

            const columns = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            const rows = ['1', '2', '3', '4', '5', '6', '7', '8'];

            for (let i = 0; i < moveHistory.length; i += 2) {
                const row = document.createElement('div');
                row.className = 'history-row';

                const index = document.createElement('div');
                index.className = 'history-index';
                index.textContent = `${Math.floor(i / 2) + 1}.`;

                const whiteMove = document.createElement('div');
                whiteMove.className = 'history-move';
                whiteMove.textContent = moveHistory[i]?.notation || '';

                const blackMove = document.createElement('div');
                blackMove.className = 'history-move';
                blackMove.textContent = moveHistory[i + 1]?.notation || '';

                row.appendChild(index);
                row.appendChild(whiteMove);
                row.appendChild(blackMove);
                moveHistoryList.appendChild(row);
            }

            // Scroll to bottom
            moveHistoryList.scrollTop = moveHistoryList.scrollHeight;
        }

        function updateStatus() {
            if (!gameActive) {
                const kingCaptured = checkKingCapture();
                if (kingCaptured) {
                    gameStatus.textContent = `${kingCaptured.charAt(0).toUpperCase() + kingCaptured.slice(1)} wins! (King captured)`;
                    gameStatus.style.backgroundColor = '#e74c3c';
                } else if (isCheckmate()) {
                    gameStatus.textContent = `Checkmate! ${currentTurn === 'white' ? 'Black' : 'White'} wins!`;
                    gameStatus.style.backgroundColor = '#e74c3c';
                } else if (isStalemate()) {
                    gameStatus.textContent = 'Stalemate! Game drawn.';
                    gameStatus.style.backgroundColor = '#f39c12';
                }
                return;
            }

            const checkStatus = isCheck(currentTurn) ? ' (CHECK!)' : '';

            // Check if bot is thinking (only when not disabled)
            if (botDifficulty !== 'none' && currentTurn === 'black' && gameActive) {
                gameStatus.textContent = `Bot (${botDifficulty.charAt(0).toUpperCase() + botDifficulty.slice(1)}) is thinking...`;
                gameStatus.style.backgroundColor = '#e67e22';
            } else {
                gameStatus.textContent = `${currentTurn.charAt(0).toUpperCase() + currentTurn.slice(1)}'s turn${checkStatus}`;
                gameStatus.style.backgroundColor = currentTurn === 'white' ? '#34495e' : '#2c3e50';
            }
        }

        // ============================================
        // Persistence (File-based export/import)
        // ============================================

        const STORAGE_KEY = 'chessGame';

        // Auto-save to localStorage (no user interaction)
        function autoSave() {
            const state = {
                board,
                currentTurn,
                selectedSquare,
                legalMoves,
                moveHistory,
                gameActive,
                enPassantTarget,
                castlingRights,
                lastMove,
                whiteKingPos,
                blackKingPos,
                botDifficulty,
                currentTime,
                currentTurnTime
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        // Manual save to file (user-triggered export)
        async function saveGame() {
            const state = {
                board,
                currentTurn,
                selectedSquare,
                legalMoves,
                moveHistory,
                gameActive,
                enPassantTarget,
                castlingRights,
                lastMove,
                whiteKingPos,
                blackKingPos,
                botDifficulty,
                currentTime,
                currentTurnTime
            };
            const jsonString = JSON.stringify(state, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const fileName = `chess-game-${timestamp}.json`;

            // Use File System Access API if available
            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: fileName,
                        types: [{ description: 'Chess Game', accept: { 'application/json': ['.json'] } }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    URL.revokeObjectURL(url);
                    return;
                } catch (err) {
                    // User canceled or API not available, fall back to blob download
                }
            }

            // Fallback: blob download
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function loadGame() {
            // Use File System Access API if available
            if (window.showOpenFilePicker) {
                try {
                    const handles = await window.showOpenFilePicker({
                        multiple: false,
                        types: [{ description: 'Chess Game', accept: { 'application/json': ['.json'] } }]
                    });
                    if (handles.length > 0) {
                        const handle = handles[0];
                        const file = await handle.getFile();
                        const text = await file.text();
                        loadFromSaved(text);
                        renderBoard();
                        renderMoveHistory();
                        updateStatus();
                    }
                } catch (err) {
                    // User canceled or API error
                }
                return;
            }

            // Fallback: create temporary file input
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const text = await file.text();
                    loadFromSaved(text);
                    renderBoard();
                    renderMoveHistory();
                    updateStatus();
                }
            };
            input.click();
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                loadFromSaved(saved);
                renderBoard();
                renderMoveHistory();
                updateStatus();
            } else {
                createNewGame();
            }
        }

        function loadFromSaved(savedData) {
            const state = JSON.parse(savedData);
            board = state.board;
            currentTurn = state.currentTurn;
            selectedSquare = state.selectedSquare;
            legalMoves = state.legalMoves;
            moveHistory = state.moveHistory;
            gameActive = state.gameActive;
            enPassantTarget = state.enPassantTarget;
            castlingRights = state.castlingRights;
            lastMove = state.lastMove;
            whiteKingPos = state.whiteKingPos;
            blackKingPos = state.blackKingPos;
            botDifficulty = state.botDifficulty !== undefined ? state.botDifficulty : 'medium';
            currentTime = state.currentTime || { white: 0, black: 0 };
            currentTurnTime = null;
            stopTimer(); // Clear any running timer from saved game

            // Update dropdown to reflect state
            const dropdown = document.getElementById('botDifficultySelect');
            if (dropdown) dropdown.value = botDifficulty;
        }

        // ============================================
        // Move Timer Functions
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            stopTimer(); // Clear any existing timer
            currentTurnTime = 0;

            // Show chess clock UI
            const chessClock = document.getElementById('chessClock');
            chessClock.style.display = 'flex';

            // Hide black clock when playing against bot
            if (botDifficulty !== 'none') {
                document.getElementById('blackClockContainer').style.display = 'none';
            }

            updateChessClockDisplay();

            timerInterval = setInterval(() => {
                if (currentTurnTime !== null) {
                    currentTurnTime++;

                    const playerKey = currentTurn === 'white' ? 'currentWhiteTime' : 'currentBlackTime';
                    document.getElementById(playerKey).textContent = formatTime(currentTurnTime);

                    // Update active player highlight
                    updateChessClockActive();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            // Accumulate time for current turn before switching
            if (currentTurnTime !== null && gameActive) {
                const playerKey = currentTurn === 'white' ? 'black' : 'white';
                currentTime[playerKey] += currentTurnTime;

                // Update total time displays
                document.getElementById('totalWhiteTime').textContent = formatTime(currentTime.white);
                document.getElementById('totalBlackTime').textContent = formatTime(currentTime.black);
            }

            currentTurnTime = null;
        }

        function updateChessClockDisplay() {
            if (timerInterval) {
                const whiteTotal = currentTime.white + (currentTurn === 'white' ? currentTurnTime : 0);
                const blackTotal = currentTime.black + (currentTurn === 'black' ? currentTurnTime : 0);

                document.getElementById('totalWhiteTime').textContent = formatTime(whiteTotal);
                document.getElementById('totalBlackTime').textContent = formatTime(blackTotal);
            }
        }

        function updateChessClockActive() {
            const whiteDisplay = document.getElementById('whiteTimeDisplay');
            const blackDisplay = document.getElementById('blackTimeDisplay');

            if (currentTurn === 'white') {
                whiteDisplay.classList.add('active');
                blackDisplay.classList.remove('active');
            } else {
                blackDisplay.classList.add('active');
                whiteDisplay.classList.remove('active');
            }
        }

// ============================================
        // Bot AI (Medium Difficulty)

        const pieceValues = {
            p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000
        };

        // Piece-square tables for better positional play
        const pawnTable = [
            [  0,  0,  0,  0,  0,  0,  0,  0],
            [ 50, 50, 50, 50, 50, 50, 50, 50],
            [ 10, 10, 20, 30, 30, 20, 10, 10],
            [  5,  5, 10, 25, 25, 10,  5,  5],
            [  0,  0,  0, 20, 20,  0,  0,  0],
            [  5, -5,-10,  0,  0,-10, -5,  5],
            [  5, 10, 10,-20,-20, 10, 10,  5],
            [  0,  0,  0,  0,  0,  0,  0,  0]
        ];

        const knightTable = [
            [-50,-40,-30,-30,-30,-30,-40,-50],
            [-40,-20,  0,  0,  0,  0,-20,-40],
            [-30,  0, 10, 15, 15, 10,  0,-30],
            [-30,  5, 15, 20, 20, 15,  5,-30],
            [-30,  0, 15, 20, 20, 15,  0,-30],
            [-30,  5, 10, 15, 15, 10,  5,-30],
            [-40,-20,  0,  5,  5,  0,-20,-40],
            [-50,-40,-30,-30,-30,-30,-40,-50]
        ];

        const bishopTable = [
            [-20,-10,-10,-10,-10,-10,-10,-20],
            [-10,  0,  0,  0,  0,  0,  0,-10],
            [-10,  0,  5, 10, 10,  5,  0,-10],
            [-10,  5,  5, 10, 10,  5,  5,-10],
            [-10,  0, 10, 10, 10, 10,  0,-10],
            [-10, 10, 10, 10, 10, 10, 10,-10],
            [-10,  5,  0,  0,  0,  0,  5,-10],
            [-20,-10,-10,-10,-10,-10,-10,-20]
        ];

        const rookTable = [
            [  0,  0,  0,  0,  0,  0,  0,  0],
            [  5, 10, 10, 10, 10, 10, 10,  5],
            [-5,  0,  0,  0,  0,  0,  0, -5],
            [-5,  0,  0,  0,  0,  0,  0, -5],
            [-5,  0,  0,  0,  0,  0,  0, -5],
            [-5,  0,  0,  0,  0,  0,  0, -5],
            [-5,  0,  0,  0,  0,  0,  0, -5],
            [  0,  0,  0,  5,  5,  0,  0,  0]
        ];

        const queenTable = [
            [-20,-10,-10, -5, -5,-10,-10,-20],
            [-10,  0,  0,  0,  0,  0,  0,-10],
            [-10,  0,  5,  5,  5,  5,  0,-10],
            [-5,  0,  5,  5,  5,  5,  0, -5],
            [  0,  0,  5,  5,  5,  5,  0, -5],
            [-10,  5,  5,  5,  5,  5,  0,-10],
            [-10,  0,  5,  0,  0,  0,  0,-10],
            [-20,-10,-10, -5, -5,-10,-10,-20]
        ];

        const kingTable = [
            [-30,-40,-40,-50,-50,-40,-40,-30],
            [-30,-40,-40,-50,-50,-40,-40,-30],
            [-30,-40,-40,-50,-50,-40,-40,-30],
            [-30,-40,-40,-50,-50,-40,-40,-30],
            [-20,-30,-30,-40,-40,-30,-30,-20],
            [-10,-20,-20,-20,-20,-20,-20,-10],
            [ 20, 20,  0,  0,  0,  0, 20, 20],
            [ 20, 30, 10,  0,  0, 10, 30, 20]
        ];

        function evaluateBoard(board, botColor) {
            let score = 0;
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const piece = board[row][col];
                    if (!piece) continue;

                    let value = pieceValues[piece.type];

                    // Add positional bonus
                    let posBonus = 0;
                    switch (piece.type) {
                        case 'p': posBonus = piece.color === 'white' ? pawnTable[row][col] : pawnTable[7 - row][col]; break;
                        case 'n': posBonus = piece.color === 'white' ? knightTable[row][col] : knightTable[7 - row][col]; break;
                        case 'b': posBonus = piece.color === 'white' ? bishopTable[row][col] : bishopTable[7 - row][col]; break;
                        case 'r': posBonus = piece.color === 'white' ? rookTable[row][col] : rookTable[7 - row][col]; break;
                        case 'q': posBonus = piece.color === 'white' ? queenTable[row][col] : queenTable[7 - row][col]; break;
                        case 'k': posBonus = piece.color === 'white' ? kingTable[row][col] : kingTable[7 - row][col]; break;
                    }

                    if (piece.color === botColor) {
                        score += value + posBonus;
                    } else {
                        score -= value + posBonus;
                    }
                }
            }
            return score;
        }

        function getAllLegalMovesForColor(color) {
            const moves = [];
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const piece = board[row][col];
                    if (piece && piece.color === color) {
                        const legal = getLegalMoves(row, col);
                        for (const move of legal) {
                            moves.push({ from: { row, col }, to: move });
                        }
                    }
                }
            }
            return moves;
        }

        function makeMoveOnBoard(from, to) {
            const piece = board[from.row][from.col];
            const targetPiece = board[to.row][to.col];

            // Save original state for undo
            const savedState = {
                piece: piece,
                target: targetPiece,
                fromRow: from.row,
                fromCol: from.col,
                toRow: to.row,
                toCol: to.col,
                to: to,
                enPassantTarget: enPassantTarget,
                castlingRights: { ...castlingRights },
                whiteKingPos: { ...whiteKingPos },
                blackKingPos: { ...blackKingPos }
            };

            // Handle en passant capture
            if (to.isEnPassant) {
                const captureRow = to.row; // Captured pawn is on the same row as destination
                board[captureRow][to.col] = null;
            }

            // Handle castling - move rook
            if (to.isCastling === 'kingside') {
                const rookRow = from.row;
                board[rookRow][5] = board[rookRow][7];
                board[rookRow][7] = null;
            } else if (to.isCastling === 'queenside') {
                const rookRow = from.row;
                board[rookRow][3] = board[rookRow][0];
                board[rookRow][0] = null;
            }

            // Update castling rights for rooks
            if (piece.type === 'r') {
                if (piece.color === 'white') {
                    // a1 (row 7, col 0) - queenside
                    if (from.row === 7 && from.col === 0) castlingRights.whiteRookQueenSideMoved = true;
                    // h1 (row 7, col 7) - kingside
                    if (from.row === 7 && from.col === 7) castlingRights.whiteRookKingSideMoved = true;
                } else {
                    // a8 (row 0, col 0) - queenside
                    if (from.row === 0 && from.col === 0) castlingRights.blackRookQueenSideMoved = true;
                    // h8 (row 0, col 7) - kingside
                    if (from.row === 0 && from.col === 7) castlingRights.blackRookKingSideMoved = true;
                }
            }

            // Update castling rights for king
            if (piece.type === 'k') {
                if (piece.color === 'white') castlingRights.whiteKingMoved = true;
                else castlingRights.blackKingMoved = true;
            }

            // Move the piece
            board[to.row][to.col] = piece;
            board[from.row][from.col] = null;

            // Handle pawn promotion (auto-promote to queen for bot search)
            const lastRow = piece.color === 'white' ? 0 : 7;
            if (piece.type === 'p' && to.row === lastRow) {
                board[to.row][to.col] = { type: 'q', color: piece.color };
            }

            // Update king position
            if (piece.type === 'k') {
                if (piece.color === 'white') whiteKingPos = { row: to.row, col: to.col };
                else blackKingPos = { row: to.row, col: to.col };
            }

            // Update en passant target
            if (to.isDoublePawn) {
                enPassantTarget = { row: (from.row + to.row) / 2, col: from.col };
            } else {
                enPassantTarget = null;
            }

            return savedState;
        }

        function undoMoveOnBoard(savedState) {
            const { piece, target, fromRow, fromCol, toRow, toCol, enPassantTarget: savedEnPassant, castlingRights: savedCastling, whiteKingPos: savedWhiteKing, blackKingPos: savedBlackKing } = savedState;

            // Revert castling rights first (before piece position change)
            castlingRights = { ...savedCastling };

            // Undo castling rook move - check if castling occurred
            const isKingside = savedState.to.isCastling === 'kingside';
            const isQueenside = savedState.to.isCastling === 'queenside';

            if (isKingside || isQueenside) {
                const backRow = piece.color === 'white' ? 7 : 0;
                if (isKingside) {
                    // Move rook from f-file (col 5) back to h-file (col 7)
                    board[backRow][7] = board[backRow][5];
                    board[backRow][5] = null;
                } else {
                    // Move rook from d-file (col 3) back to a-file (col 0)
                    board[backRow][0] = board[backRow][3];
                    board[backRow][3] = null;
                }
            }

            // Revert piece position
            board[fromRow][fromCol] = piece;
            board[toRow][toCol] = target;

            // Revert en passant capture
            if (savedState.to.isEnPassant) {
                board[toRow][toCol] = { type: 'p', color: piece.color === 'white' ? 'black' : 'white' };
            }

            // Revert castling rights for king
            if (piece.type === 'k') {
                if (piece.color === 'white') castlingRights.whiteKingMoved = savedState.castlingRights.whiteKingMoved;
                else castlingRights.blackKingMoved = savedState.castlingRights.blackKingMoved;
            }

            // Revert rook castling rights
            if (piece.type === 'r') {
                if (piece.color === 'white') {
                    // a1 (row 7, col 0) - queenside
                    if (fromRow === 7 && fromCol === 0) castlingRights.whiteRookQueenSideMoved = savedState.castlingRights.whiteRookQueenSideMoved;
                    // h1 (row 7, col 7) - kingside
                    if (fromRow === 7 && fromCol === 7) castlingRights.whiteRookKingSideMoved = savedState.castlingRights.whiteRookKingSideMoved;
                } else {
                    // a8 (row 0, col 0) - queenside
                    if (fromRow === 0 && fromCol === 0) castlingRights.blackRookQueenSideMoved = savedState.castlingRights.blackRookQueenSideMoved;
                    // h8 (row 0, col 7) - kingside
                    if (fromRow === 0 && fromCol === 7) castlingRights.blackRookKingSideMoved = savedState.castlingRights.blackRookKingSideMoved;
                }
            }

            // Revert king positions
            whiteKingPos = { ...savedWhiteKing };
            blackKingPos = { ...savedBlackKing };

            // Restore en passant target
            enPassantTarget = savedState.enPassantTarget;
        }

        function botMakeMove() {
            if (!gameActive || botDifficulty === 'none') return;

            const botColor = 'black';
            const allMoves = getAllLegalMovesForColor(botColor);

            if (allMoves.length === 0) {
                // Bot has no legal moves - check for checkmate or stalemate
                if (isCheck(botColor)) {
                    gameActive = false;
                    gameStatus.textContent = `Checkmate! White wins!`;
                    gameStatus.style.backgroundColor = '#e74c3c';
                } else {
                    gameActive = false;
                    gameStatus.textContent = 'Stalemate! Game drawn.';
                    gameStatus.style.backgroundColor = '#f39c12';
                }
                return;
            }

            let bestMove = null;

            switch (botDifficulty) {
                case 'easy':
                    // Easy: Random move with slight bias toward captures
                    bestMove = botGetRandomMove(allMoves);
                    break;
                case 'medium':
                    // Medium: 2-ply search with piece-square tables
                    bestMove = botGetMediumMove(botColor, allMoves);
                    break;
                case 'hard':
                    // Hard: True 3-ply minimax (black move + white response + black followup)
                    bestMove = botGetHardMove(botColor, allMoves);
                    break;
            }

            // Execute the move
            if (bestMove) {
                executeMove(bestMove.from, bestMove.to);
            }
        }

        function botGetRandomMove(allMoves) {
            // Filter out moves where the moved piece gets captured immediately
            const safeMoves = [];

            for (const move of allMoves) {
                const savedState = makeMoveOnBoard(move.from, move.to);

                // Check if any opponent piece can capture our moved piece on next turn
                const opponentColor = 'white'; // After black moves, white responds
                const opponentCanCapture = getAllLegalMovesForColor(opponentColor).some(
                    oppMove => oppMove.to.row === move.to.row && oppMove.to.col === move.to.col
                );

                undoMoveOnBoard(savedState);

                if (!opponentCanCapture) {
                    safeMoves.push(move);
                }
            }

            // If we have safe moves, use them; otherwise fall back to all moves
            const candidates = safeMoves.length > 0 ? safeMoves : allMoves;

            // Add small random factor to encourage variety
            const weightedMoves = candidates.map(move => ({
                move,
                weight: 1 + Math.random() * 0.1
            }));

            let totalWeight = 0;
            for (const item of weightedMoves) {
                totalWeight += item.weight;
            }

            let random = Math.random() * totalWeight;
            for (const item of weightedMoves) {
                random -= item.weight;
                if (random <= 0) return item.move;
            }
            return candidates[Math.floor(Math.random() * candidates.length)];
        }

        function botGetMediumMove(botColor, allMoves) {
            let bestScore = -Infinity;
            let bestScoreMoves = [];

            for (const move of allMoves) {
                const savedState = makeMoveOnBoard(move.from, move.to);

                // Evaluate the resulting position
                let score = evaluateBoard(board, botColor);

                // Add small random factor for variety
                score += Math.random() * 5;

                undoMoveOnBoard(savedState);

                if (score > bestScore) {
                    bestScore = score;
                    bestScoreMoves = [move];
                } else if (score === bestScore) {
                    bestScoreMoves.push(move);
                }
            }

            // Choose randomly from best moves
            if (bestScoreMoves.length > 0) {
                return bestScoreMoves[Math.floor(Math.random() * bestScoreMoves.length)];
            }
            return allMoves[0];
        }

        function botGetHardMove(botColor, allMoves) {
            // Sort moves: prioritize captures first for better pruning
            const scoredMoves = allMoves.map(move => {
                let score = 0;
                // Bonus for capturing pieces (higher value = more bonus)
                if (board[move.to.row][move.to.col]) {
                    score += pieceValues[board[move.to.row][move.to.col].type] * 10;
                }
                // Small bonus for en passant
                if (move.isEnPassant) score += 50;
                return { move, score };
            });

            scoredMoves.sort((a, b) => b.score - a.score);

            let bestMove = null;
            let bestScore = -Infinity;

            for (const item of scoredMoves) {
                const savedState = makeMoveOnBoard(item.move.from, item.move.to);

                // Minimax at depth 2 with quiescence
                const opponentColor = botColor === 'white' ? 'black' : 'white';
                const oppScore = minimax(opponentColor, 2);

                undoMoveOnBoard(savedState);

                const score = -oppScore;
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = item.move;
                }
            }

            return bestMove || allMoves[0];
        }

        // Quiescence search: evaluate position considering only captures
        // Returns a quick evaluation that accounts for immediate tactical threats
function evaluateBoardWithCaptures(color) {
            const moves = getAllLegalMovesForColor(color);

            // Filter capture moves (including en passant)
            let bestCaptureValue = 0;
            for (const move of moves) {
                if (board[move.to.row][move.to.col] || move.isEnPassant) {
                    let capturedPieceType = board[move.to.row][move.to.col]?.type || 'p';
                    const captureValue = pieceValues[capturedPieceType];
                    // Pawn promotion bonus
                    if (move.isPromotion && !board[move.to.row][move.to.col]) {
                        bestCaptureValue += 800;
                    } else if (captureValue > bestCaptureValue) {
                        bestCaptureValue = captureValue;
                    }
                }
            }

            const baseScore = evaluateBoard(board, color);
            // Add a bonus for having good capture opportunities
            return baseScore + (color === 'black' ? Math.min(bestCaptureValue, 500) : -Math.min(bestCaptureValue, 500));
        }

function minimax(color, depth) {
            // Save current king positions for this level
            const savedWhiteKingPos = { ...whiteKingPos };
            const savedBlackKingPos = { ...blackKingPos };

            const moves = getAllLegalMovesForColor(color);

            // Terminal node - check for game over (checkmate or stalemate)
            if (moves.length === 0) {
                if (isCheck(color)) {
                    return color === 'black' ? -100000 : 100000; // Black is in checkmate
                } else {
                    return 0; // Stalemate
                }
            }

            // Max depth reached - use quiescence search (evaluate with capture extension)
            if (depth === 0) {
                const score = evaluateBoardWithCaptures(color);
                
                // Restore king positions before returning
                whiteKingPos = savedWhiteKingPos;
                blackKingPos = savedBlackKingPos;
                
                return score;
            }

            let bestScore;

            if (color === 'black') {
                // Maximize for black
                bestScore = -Infinity;
                for (const move of moves) {
                    const savedState = makeMoveOnBoard(move.from, move.to);
                    
                    // Save king positions after this move before recursive call
                    const localWhitePos = { ...whiteKingPos };
                    const localBlackPos = { ...blackKingPos };
                    
                    const score = minimax('white', depth - 1);
                    undoMoveOnBoard(savedState);
                    
                    // Restore original king positions for next iteration
                    whiteKingPos = savedWhiteKingPos;
                    blackKingPos = savedBlackKingPos;
                    
                    bestScore = Math.max(bestScore, score);
                }
            } else {
                // Minimize for white
                bestScore = Infinity;
                for (const move of moves) {
                    const savedState = makeMoveOnBoard(move.from, move.to);
                    
                    // Save king positions after this move before recursive call
                    const localWhitePos = { ...whiteKingPos };
                    const localBlackPos = { ...blackKingPos };
                    
                    const score = minimax('black', depth - 1);
                    undoMoveOnBoard(savedState);
                    
                    // Restore original king positions for next iteration
                    whiteKingPos = savedWhiteKingPos;
                    blackKingPos = savedBlackKingPos;
                    
                    bestScore = Math.min(bestScore, score);
                }
            }
            
            return bestScore;
        }

        // Start the game
        init();
    </script>
