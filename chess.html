<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPA Chess</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        h1 { text-align: center; padding: 10px; background: #2c3e50; color: white; font-size: 1.5rem; }
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
        }
        .panel { padding: 15px; overflow-y: auto; }
        .board-panel {
            flex: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ecf0f1;
            padding: 20px;
        }
        .resize-handle {
            width: 5px;
            background: #bdc3c7;
            cursor: col-resize;
            transition: background 0.2s;
        }
        .resize-handle:hover { background: #7f8c8d; }
        .history-panel {
            flex: 1;
            min-width: 250px;
            max-width: 300px;
            background: #fff;
            border-left: 1px solid #bdc3c7;
        }

        /* Chess Board */
        #mcp-board-grid-8x8 {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 12px solid #5d4037;
            user-select: none;
            max-width: 126vh;
            max-height: 126vh;
            aspect-ratio: 1 / 1;
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(22px, 8vh, 64px);
            cursor: pointer;
            position: relative;
            border: none;
            background: transparent;
            padding: 0;
        }
        .square::before {
            content: '';
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            z-index: -1;
        }
        .square.white { background: #f0e6d2; }
        .square.black { background: #795548; }
        .square.selected { background: #f1c40f !important; }
        .square.legal-move::after {
            content: '';
            position: absolute;
            width: clamp(8px, 2vh, 16px);
            height: clamp(8px, 2vh, 16px);
            background: radial-gradient(circle at center, rgba(46, 204, 113, 0.9) 0%, rgba(46, 204, 113, 0.5) 70%);
            border-radius: 50%;
        }
        .square.last-move { background: #e67e22 !important; }
        .square.in-check { background: #e74c3c !important; }

        /* Piece styling */
        .piece {
            cursor: pointer;
            z-index: 1;
            display: inline-block;
            transition: transform 0.2s ease, filter 0.2s ease;
            pointer-events: none;  /* Allow clicks to pass through to button element for MCP compatibility */
        }
        .piece.white {
            color: #ffffff;
            text-shadow:
                -2px -2px 4px rgba(255,255,255,0.6),
                 1px 1px 2px rgba(0,0,0,0.3),
                 2px 2px 4px rgba(0,0,0,0.4),
                 3px 3px 8px rgba(0,0,0,0.5);
            filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.3));
        }
        .piece.black {
            color: #0a0b0d;
            text-shadow:
                1px 1px 2px rgba(255,255,255,0.4),
                -1px -1px 0 #3a3b40,
                2px 2px 0 #2d2e33,
                4px 6px 8px rgba(0,0,0,0.7);
        }
        .piece:hover { transform: scale(1.1); }

        /* Game Status */
        #mcp-status-display {
            margin-top: 15px;
            padding: 10px 20px;
            background: #34495e;
            color: white;
            border-radius: 5px;
            font-size: 1.2rem;
        }

        /* Move History */
        .history-panel h3 { padding-bottom: 10px; border-bottom: 1px solid #bdc3c7; color: #2c3e50; }
        #mcp-move-history-list {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        .history-row { display: flex; padding: 5px 10px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .history-row:nth-child(odd) { background: #f8f9fa; }
        .history-index { width: 30px; color: #7f8c8d; }
        .history-move { flex: 1; font-family: monospace; }

        /* Buttons */
        .button-group { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        .btn {
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-primary { background: #3498db; color: white; }
        .btn-secondary { background: #95a5a6; color: white; }

        /* Coordinates */
        .coord-rank { position: absolute; left: 2px; top: 2px; font-size: 10px; color: #7f8c8d; }
        .coord-file { position: absolute; right: 2px; bottom: 2px; font-size: 10px; color: #7f8c8d; }

        /* Chess Clock */
        .chess-clock {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 15px;
            background: #ecf0f1;
            border-radius: 8px;
            font-family: monospace;
        }
        .player-time {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px;
            min-width: 60px;
            background: #fff;
            border-radius: 4px;
        }
        .time-display { font-size: 1.3rem; color: #2c3e50; font-weight: bold; }
        .player-name { font-size: 0.8rem; color: #7f8c8d; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }

        /* Dialog */
        .mcp-dialog-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .mcp-dialog-container {
            background: white;
            border-radius: 8px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .mcp-dialog-header { margin-bottom: 16px; }
        .mcp-dialog-title { font-size: 1.5rem; color: #2c3e50; margin-bottom: 8px; }
        .mcp-dialog-message { color: #7f8c8d; line-height: 1.6; }
        .mcp-dialog-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        /* Promotion Options */
        .promotion-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        .promotion-option {
            padding: 16px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 3rem;
        }
        .promotion-option:hover { background: #f8f9fa; border-color: #3498db; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .resize-handle { width: 100%; height: 5px; cursor: row-resize; }
            .history-panel { max-width: 100%; min-height: 200px; }
        }
    </style>
</head>
<body>
    <h1>♟️ SPA Chess</h1>

    <div class="main-container">
        <div class="panel board-panel" role="main">
            <div id="mcp-board-grid-8x8" role="grid"></div>
            <div id="mcp-status-display">White's turn</div>
        </div>
        <div class="resize-handle" id="resizeHandle"></div>
        <div class="panel history-panel">
            <div id="chessClock" class="chess-clock" style="display: none;">
                <div class="player-time white active"><span class="player-name">White</span><span id="currentWhiteTime" class="time-display">00:00</span></div>
                <div id="blackClockContainer">
                    <div class="player-time black"><span class="player-name">Black</span><span id="currentBlackTime" class="time-display">00:00</span></div>
                </div>
            </div>

            <h3>Move History</h3>
            <div id="mcp-move-history-list">
                <p style="color: #7f8c8d; text-align: center; padding: 20px;">No moves yet</p>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="mcp-btn-new-game">New Game</button>
                <button class="btn btn-secondary" id="mcp-btn-save-game">Save Game</button>
                <button class="btn btn-secondary" id="mcp-btn-load-game">Load Game</button>
                <button class="btn btn-danger" id="mcp-btn-reset-position">Reset Position</button>
            </div>

            <div id="mcp-bot-settings-panel" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #bdc3c7;">
                <label for="botDifficultySelect" style="display: block; margin-bottom: 5px; color: #2c3e50; font-weight: 600;">Bot Difficulty</label>
                <select id="mcp-bot-difficulty-select" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #bdc3c7;">
                    <option value="none">No Bot (Human vs Human)</option>
                    <option value="easy">Easy (Random)</option>
                    <option value="medium" selected>Medium (2-ply)</option>
                    <option value="hard">Hard (3-ply)</option>
                </select>
            </div>
        </div>
    </div>

<script>
// ============================================
// CHESS GAME SPA
// ============================================

class Piece {
    constructor(type, color) { this.type = type; this.color = color; }
    getType() { return this.type; }
    getColor() { return this.color; }
    isValidPosition(row, col) { return row >= 0 && row < 8 && col >= 0 && col < 8; }
    getPseudoLegalMoves(board, gameState, row, col) {
        throw new Error('getPseudoLegalMoves must be implemented by subclass');
    }
}

class Pawn extends Piece {
    constructor(color) { super('p', color); }
    getPseudoLegalMoves(board, gameState, row, col) {
        const moves = [];
        const direction = this.color === 'white' ? -1 : 1;
        const startRow = this.color === 'white' ? 6 : 1;

        if (board.isEmpty(row + direction, col)) {
            moves.push({ row: row + direction, col: col });
            if (row === startRow && board.isEmpty(row + direction * 2, col)) {
                moves.push({ row: row + direction * 2, col: col, isDoublePawn: true });
            }
        }

        const captureOffsets = [-1, 1];
        for (const offset of captureOffsets) {
            if (board.isOpponentPiece(row + direction, col + offset, this.color)) {
                moves.push({ row: row + direction, col: col + offset });
            } else if (gameState.enPassantTarget &&
                       gameState.enPassantTarget.row === row + direction &&
                       gameState.enPassantTarget.col === col + offset) {
                moves.push({ row: row + direction, col: col + offset, isEnPassant: true });
            }
        }
        return moves;
    }
}

class Knight extends Piece {
    constructor(color) { super('n', color); }
    getPseudoLegalMoves(board, gameState, row, col) {
        const moves = [];
        const knightOffsets = [
            { dr: -2, dc: -1 }, { dr: -2, dc: 1 },
            { dr: -1, dc: -2 }, { dr: -1, dc: 2 },
            { dr: 1, dc: -2 }, { dr: 1, dc: 2 },
            { dr: 2, dc: -1 }, { dr: 2, dc: 1 }
        ];
        for (const offset of knightOffsets) {
            const targetRow = row + offset.dr;
            const targetCol = col + offset.dc;
            if (this.isValidPosition(targetRow, targetCol)) {
                if (board.isEmpty(targetRow, targetCol) || board.isOpponentPiece(targetRow, targetCol, this.color)) {
                    moves.push({ row: targetRow, col: targetCol });
                }
            }
        }
        return moves;
    }
}

class SlidingPiece extends Piece {
    constructor(type, color) { super(type, color); }
    getSlidingMoves(board, gameState, row, col, directions) {
        const moves = [];
        for (const d of directions) {
            let r = row + d.dr, c = col + d.dc;
            while (this.isValidPosition(r, c)) {
                if (board.isEmpty(r, c)) { moves.push({ row: r, col: c }); }
                else if (board.isOpponentPiece(r, c, this.color)) {
                    moves.push({ row: r, col: c });
                    break;
                } else { break; }
                r += d.dr; c += d.dc;
            }
        }
        return moves;
    }
}

class Rook extends SlidingPiece { constructor(color) { super('r', color); }
    getPseudoLegalMoves(board, gameState, row, col) {
        const directions = [{ dr: -1, dc: 0 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: 0, dc: 1 }];
        return this.getSlidingMoves(board, gameState, row, col, directions);
    }
}
class Bishop extends SlidingPiece { constructor(color) { super('b', color); }
    getPseudoLegalMoves(board, gameState, row, col) {
        const directions = [{ dr: -1, dc: -1 }, { dr: -1, dc: 1 }, { dr: 1, dc: -1 }, { dr: 1, dc: 1 }];
        return this.getSlidingMoves(board, gameState, row, col, directions);
    }
}
class Queen extends SlidingPiece { constructor(color) { super('q', color); }
    getPseudoLegalMoves(board, gameState, row, col) {
        const directions = [{ dr: -1, dc: 0 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: 0, dc: 1 },
                            { dr: -1, dc: -1 }, { dr: -1, dc: 1 }, { dr: 1, dc: -1 }, { dr: 1, dc: 1 }];
        return this.getSlidingMoves(board, gameState, row, col, directions);
    }
}

class King extends Piece {
    constructor(color) { super('k', color); }
    getPseudoLegalMoves(board, gameState, row, col) {
        const moves = [];
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                const targetRow = row + dr, targetCol = col + dc;
                if (this.isValidPosition(targetRow, targetCol)) {
                    if (board.isEmpty(targetRow, targetCol) || board.isOpponentPiece(targetRow, targetCol, this.color)) {
                        moves.push({ row: targetRow, col: targetCol });
                    }
                }
            }
        }

        const colorKey = this.color === 'white' ? 'whiteKingMoved' : 'blackKingMoved';
        if (!gameState.castlingRights[colorKey] &&
            !gameState.isSquareUnderAttack(board, row, col, this.color === 'white' ? 'black' : 'white')) {
            const kingsideRookMoved = this.color === 'white'
                ? gameState.castlingRights.whiteRookKingSideMoved
                : gameState.castlingRights.blackRookKingSideMoved;
            if (!kingsideRookMoved && board.isEmpty(row, 5) && board.isEmpty(row, 6)) {
                if (!gameState.isSquareUnderAttack(board, row, 5, this.color === 'white' ? 'black' : 'white') &&
                    !gameState.isSquareUnderAttack(board, row, 6, this.color === 'white' ? 'black' : 'white')) {
                    moves.push({ row: row, col: 6, isCastling: 'kingside' });
                }
            }

            const queensideRookMoved = this.color === 'white'
                ? gameState.castlingRights.whiteRookQueenSideMoved
                : gameState.castlingRights.blackRookQueenSideMoved;
            if (!queensideRookMoved && board.isEmpty(row, 1) && board.isEmpty(row, 2) && board.isEmpty(row, 3)) {
                if (!gameState.isSquareUnderAttack(board, row, 3, this.color === 'white' ? 'black' : 'white') &&
                    !gameState.isSquareUnderAttack(board, row, 2, this.color === 'white' ? 'black' : 'white')) {
                    moves.push({ row: row, col: 2, isCastling: 'queenside' });
                }
            }
        }
        return moves;
    }
}

function createPiece(type, color) {
    switch (type) {
        case 'p': return new Pawn(color);
        case 'n': return new Knight(color);
        case 'b': return new Bishop(color);
        case 'r': return new Rook(color);
        case 'q': return new Queen(color);
        case 'k': return new King(color);
        default: throw new Error(`Unknown piece type: ${type}`);
    }
}

class ChessBoard {
    constructor() { this.grid = Array(8).fill(null).map(() => Array(8).fill(null)); }
    initializeBoard() {
        for (let row = 0; row < 8; row++) { for (let col = 0; col < 8; col++) { this.grid[row][col] = null; } }
        this.grid[0] = [new Rook('black'), new Knight('black'), new Bishop('black'),
                        new Queen('black'), new King('black'), new Bishop('black'),
                        new Knight('black'), new Rook('black')];
        for (let col = 0; col < 8; col++) { this.grid[1][col] = new Pawn('black'); }
        for (let col = 0; col < 8; col++) { this.grid[6][col] = new Pawn('white'); }
        this.grid[7] = [new Rook('white'), new Knight('white'), new Bishop('white'),
                        new Queen('white'), new King('white'), new Bishop('white'),
                        new Knight('white'), new Rook('white')];
    }
    getPiece(row, col) { return this.isValidPosition(row, col) ? this.grid[row][col] : null; }
    setPiece(row, col, piece) { if (this.isValidPosition(row, col)) { this.grid[row][col] = piece; } }
    isEmpty(row, col) { return !this.getPiece(row, col); }
    isValidPosition(row, col) { return row >= 0 && row < 8 && col >= 0 && col < 8; }
    isOwnPiece(row, col, color) { const piece = this.getPiece(row, col); return piece && piece.color === color; }
    isOpponentPiece(row, col, color) { const piece = this.getPiece(row, col); return piece && piece.color !== color; }
    copyGrid() { return this.grid.map(row => row.map(piece => piece ? { type: piece.type, color: piece.color } : null)); }
}

class GameState {
    constructor(board) {
        this.board = board;
        this.currentTurn = 'white';
        this.enPassantTarget = null;
        this.castlingRights = {
            whiteKingMoved: false, blackKingMoved: false,
            whiteRookKingSideMoved: false, whiteRookQueenSideMoved: false,
            blackRookKingSideMoved: false, blackRookQueenSideMoved: false
        };
        this.lastMove = null;
        this.whiteKingPos = { row: 7, col: 4 };
        this.blackKingPos = { row: 0, col: 4 };
    }
    switchTurn() { this.currentTurn = this.currentTurn === 'white' ? 'black' : 'white'; }
    findKing(color) {
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const piece = this.board.grid[row][col];
                if (piece && piece.type === 'k' && piece.color === color) { return { row, col }; }
            }
        }
        return null;
    }
    isSquareUnderAttack(board, row, col, attackerColor) {
        const pawnDirection = attackerColor === 'white' ? -1 : 1;
        if (board.isValidPosition(row + pawnDirection, col - 1)) {
            const piece = board.getPiece(row + pawnDirection, col - 1);
            if (piece && piece.color === attackerColor && piece.type === 'p') return true;
        }
        if (board.isValidPosition(row + pawnDirection, col + 1)) {
            const piece = board.getPiece(row + pawnDirection, col + 1);
            if (piece && piece.color === attackerColor && piece.type === 'p') return true;
        }

        const knightMoves = [
            { dr: -2, dc: -1 }, { dr: -2, dc: 1 },
            { dr: -1, dc: -2 }, { dr: -1, dc: 2 },
            { dr: 1, dc: -2 }, { dr: 1, dc: 2 },
            { dr: 2, dc: -1 }, { dr: 2, dc: 1 }
        ];
        for (const move of knightMoves) {
            if (board.isValidPosition(row + move.dr, col + move.dc)) {
                const piece = board.getPiece(row + move.dr, col + move.dc);
                if (piece && piece.color === attackerColor && piece.type === 'n') return true;
            }
        }

        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                if (board.isValidPosition(row + dr, col + dc)) {
                    const piece = board.getPiece(row + dr, col + dc);
                    if (piece && piece.color === attackerColor && piece.type === 'k') return true;
                }
            }
        }

        const directions = [
            { dr: -1, dc: 0 }, { dr: 1, dc: 0 },
            { dr: 0, dc: -1 }, { dr: 0, dc: 1 },
            { dr: -1, dc: -1 }, { dr: -1, dc: 1 },
            { dr: 1, dc: -1 }, { dr: 1, dc: 1 }
        ];
        for (let i = 0; i < directions.length; i++) {
            const d = directions[i];
            let r = row + d.dr, c = col + d.dc;
            let distance = 0;
            while (board.isValidPosition(r, c)) {
                distance++;
                const piece = board.getPiece(r, c);
                if (piece) {
                    if (piece.color === attackerColor) {
                        const isRookLike = i < 4;
                        if (piece.type === 'q' || (isRookLike && piece.type === 'r') ||
                            (!isRookLike && piece.type === 'b')) return true;
                        if (piece.type === 'k' && distance === 1) return true;
                    }
                    break;
                }
                r += d.dr; c += d.dc;
            }
        }
        return false;
    }
    getPseudoLegalMoves(row, col) {
        const piece = this.board.getPiece(row, col);
        if (!piece || piece.color !== this.currentTurn) return [];
        return piece.getPseudoLegalMoves(this.board, this, row, col);
    }
    getLegalMoves(board, row, col) {
        const piece = board.getPiece(row, col);
        if (!piece || piece.color !== this.currentTurn) return [];
        const pseudoMoves = this.getPseudoLegalMoves(row, col);
        const legalMoves = [];
        const opponentColor = this.currentTurn === 'white' ? 'black' : 'white';

        for (const move of pseudoMoves) {
            const savedTarget = board.grid[move.row][move.col];
            const savedSource = board.grid[row][col];

            board.setPiece(move.row, move.col, savedSource);
            this.board.setPiece(row, col, null);

            let originalKingPos = null;
            if (piece.type === 'k') {
                originalKingPos = piece.color === 'white' ? this.whiteKingPos : this.blackKingPos;
            }

            const kingInCheck = this.isSquareUnderAttack(
                this.board,
                piece.type === 'k' ? move.row : (piece.color === 'white' ? this.whiteKingPos.row : this.blackKingPos.row),
                piece.type === 'k' ? move.col : (piece.color === 'white' ? this.whiteKingPos.col : this.blackKingPos.col),
                opponentColor
            );

            this.board.setPiece(row, col, savedSource);
            this.board.setPiece(move.row, move.col, savedTarget);

            if (originalKingPos) {
                piece.color === 'white' ? this.whiteKingPos = originalKingPos : this.blackKingPos = originalKingPos;
            }

            let validCastling = true;
            if (move.isCastling === 'kingside') {
                const backRow = piece.color === 'white' ? 7 : 0;
                validCastling = !this.isSquareUnderAttack(this.board, backRow, 5, opponentColor);
            } else if (move.isCastling === 'queenside') {
                const backRow = piece.color === 'white' ? 7 : 0;
                validCastling = !this.isSquareUnderAttack(this.board, backRow, 3, opponentColor);
            }

            if (!kingInCheck && validCastling) { legalMoves.push(move); }
        }
        return legalMoves;
    }
    isCheck(color) {
        const kingPos = this.findKing(color);
        if (!kingPos) return false;
        const opponentColor = color === 'white' ? 'black' : 'white';
        return this.isSquareUnderAttack(this.board, kingPos.row, kingPos.col, opponentColor);
    }
    
    hasLegalMoves(board, color) {
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const piece = board.getPiece(row, col);
                if (piece && piece.color === color) { 
                    if (this.getLegalMoves(board, row, col).length > 0) return true;
                }
            }
        }
        return false;
    }
    
    isCheckmate() { 
        const currentColor = this.currentTurn;
        return this.isCheck(currentColor) && !this.hasLegalMoves(this.board, currentColor);
    }
    
    isStalemate() { 
        const currentColor = this.currentTurn;
        return !this.isCheck(currentColor) && !this.hasLegalMoves(this.board, currentColor);
    }
}

    getAllLegalMovesForColor(game, color) {
        const moves = [];
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const piece = game.board.grid[row][col];
                if (piece && piece.color === color) {
                    const legalMoves = game.gameState.getLegalMoves(game.board, row, col);
                    // LOG: Piece found with its legal moves
                    console.log(`[BotAI.getAllLegalMoves] ${color} ${piece.type.toUpperCase()} at (${row},${col}) has ${legalMoves.length} legal move(s):`, 
                        JSON.stringify(legalMoves.map(m => `(${m.row},${m.col})`)));
                    for (const move of legalMoves) {
                        moves.push({ from: { row, col }, to: move, isEnPassant: !!move.isEnPassant });
                    }
                }
            }
        }
        console.log(`[BotAI.getAllLegalMovesForColor] ${color} has ${moves.length} total legal move(s)`);
        return moves;
    }

    // Board cloning approach for safe move evaluation without mutating original state
    cloneGameForEvaluation(game) {
        const clonedBoard = new ChessBoard();
        
        // Deep copy grid with piece instances (not just data)
        clonedBoard.grid = game.board.copyGrid().map((row, rIdx) => 
            row.map((pieceData, cIdx) => {
                if (!pieceData) return null;
                return createPiece(pieceData.type, pieceData.color);
            })
        );
        
        const clonedGameState = new GameState(clonedBoard);
        clonedGameState.currentTurn = game.gameState.currentTurn;
        clonedGameState.enPassantTarget = game.gameState.enPassantTarget ? {...game.gameState.enPassantTarget} : null;
        clonedGameState.castlingRights = {
            whiteKingMoved: game.gameState.castlingRights.whiteKingMoved,
            blackKingMoved: game.gameState.blackKingMoved,
            whiteRookKingSideMoved: game.gameState.castlingRights.whiteRookKingSideMoved,
            whiteRookQueenSideMoved: game.gameState.castlingRights.whiteRookQueenSideMoved,
            blackRookKingSideMoved: game.gameState.castlingRights.blackRookKingSideMoved,
            blackRookQueenSideMoved: game.gameState.castlingRights.blackRookQueenSideMoved
        };
        clonedGameState.lastMove = game.gameState.lastMove ? {...game.gameState.lastMove} : null;
        clonedGameState.whiteKingPos = {...game.gameState.whiteKingPos};
        clonedGameState.blackKingPos = {...game.gameState.blackKingPos};
        
        return { 
            board: clonedBoard, 
            gameState: clonedGameState,
            moveHistory: game.moveHistory || []  // Include move history for isRepetition checks
        };
    }

    makeMoveOnClonedGame(clonedGame, from, to) {
        const piece = clonedGame.board.grid[from.row][from.col];
        const targetPiece = clonedGame.board.grid[to.row][to.col];

        if (to.isEnPassant) {
            const capturedPawnRow = piece.color === 'white' ? to.row + 1 : to.row - 1;
            clonedGame.board.grid[capturedPawnRow][to.col] = null;
        }

        if (to && to.isCastling === 'kingside') {
            const rookRow = from.row;
            clonedGame.board.grid[rookRow][5] = clonedGame.board.grid[rookRow][7];
            clonedGame.board.grid[rookRow][7] = null;
            const colorKey = piece.color === 'white' ? 'whiteRookKingSideMoved' : 'blackRookKingSideMoved';
            clonedGame.gameState.castlingRights[colorKey] = true;
        } else if (to && to.isCastling === 'queenside') {
            const rookRow = from.row;
            clonedGame.board.grid[rookRow][3] = clonedGame.board.grid[rookRow][0];
            clonedGame.board.grid[rookRow][0] = null;
            const colorKey = piece.color === 'white' ? 'whiteRookQueenSideMoved' : 'blackRookQueenSideMoved';
            clonedGame.gameState.castlingRights[colorKey] = true;
        }

        if (piece.type === 'r') {
            const whiteQueenside = piece.color === 'white' && from.row === 7 && from.col === 0;
            const whiteKingside = piece.color === 'white' && from.row === 7 && from.col === 7;
            const blackQueenside = piece.color === 'black' && from.row === 0 && from.col === 0;
            const blackKingside = piece.color === 'black' && from.row === 0 && from.col === 7;

            if (piece.color === 'white') {
                clonedGame.gameState.castlingRights.whiteRookQueenSideMoved |= whiteQueenside;
                clonedGame.gameState.castlingRights.whiteRookKingSideMoved |= whiteKingside;
            } else {
                clonedGame.gameState.castlingRights.blackRookQueenSideMoved |= blackQueenside;
                clonedGame.gameState.castlingRights.blackRookKingSideMoved |= blackKingside;
            }
        }

        if (piece.type === 'k') {
            const colorKey = piece.color === 'white' ? 'whiteKingMoved' : 'blackKingMoved';
            clonedGame.gameState.castlingRights[colorKey] = true;
            if (piece.color === 'white') { clonedGame.gameState.whiteKingPos = { row: to.row, col: to.col }; }
            else { clonedGame.gameState.blackKingPos = { row: to.row, col: to.col }; }
        }

        clonedGame.board.grid[to.row][to.col] = piece;
        clonedGame.board.grid[from.row][from.col] = null;

        if (piece.type === 'p') {
            const lastRowWhite = 0;   // White reaches row 0
            const lastRowBlack = 7;   // Black reaches row 7
            
            if (to.row === lastRowWhite || to.row === lastRowBlack) {
                clonedGame.board.grid[to.row][to.col] = new Queen(piece.color);
            }
        }

        if (to.isDoublePawn) {
            clonedGame.gameState.enPassantTarget = { row: Math.floor((from.row + to.row) / 2), col: from.col };
        } else { clonedGame.gameState.enPassantTarget = null; }
    }

    evaluateBoardOnCloned(clonedGame, botColor) {
        return this.evaluateBoard(clonedGame, botColor);
    }

    evaluateBoard(game, botColor) {
        let score = 0;
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const piece = game.board.grid[row][col];
                if (!piece) continue;

                let value = this.pieceValues[piece.type];
                let posBonus = 0;

                switch (piece.type) {
                    case 'p':
                        posBonus = piece.color === 'white' ? this.pawnTable[row][col] : this.pawnTable[7 - row][col];
                        break;
                    case 'n':
                        posBonus = piece.color === 'white' ? this.knightTable[row][col] : this.knightTable[7 - row][col];
                        break;
                    case 'b':
                        posBonus = piece.color === 'white' ? this.bishopTable[row][col] : this.bishopTable[7 - row][col];
                        break;
                    case 'r':
                        posBonus = piece.color === 'white' ? this.rookTable[row][col] : this.rookTable[7 - row][col];
                        break;
                    case 'q':
                        posBonus = piece.color === 'white' ? this.queenTable[row][col] : this.queenTable[7 - row][col];
                        break;
                    case 'k':
                        posBonus = piece.color === 'white' ? this.kingTable[row][col] : this.kingTable[7 - row][col];
                        break;
                }

                if (piece.color === 'black') { score += value + posBonus; }
                else { score -= value + posBonus; }
            }
        }
        return score;
    }

    getRandomMove(game, allMoves) {
        const botColor = game.gameState.currentTurn === 'white' ? 'black' : 'white';
        const opponentColor = botColor === 'white' ? 'black' : 'white';

        return { from: selected.from, to: selected.to };
    }

    isRepetition(game, move) {
        const history = game.moveHistory || [];
        if (history.length >= 2) {
            const lastMove = history[history.length - 1];
            const secondLastMove = history.length >= 2 ? history[history.length - 2] : null;

            if (secondLastMove &&
                move.from.row === secondLastMove.to.row &&
                move.from.col === secondLastMove.to.col &&
                move.to.row === secondLastMove.from.row &&
                move.to.col === secondLastMove.from.col) {
                return true;
            }

            for (let i = 0; i < history.length - 1; i++) {
                if (history[i].from.row === move.to.row &&
                    history[i].from.col === move.to.col &&
                    history[i].to.row === move.from.row &&
                    history[i].to.col === move.from.col) {
                    return true;
                }
            }
        }
        return false;
    }

    getMediumMove(game, botColor, allMoves) {
        // Defensive: ensure allMoves is valid
        if (!allMoves || !Array.isArray(allMoves) || allMoves.length === 0) {
            console.error('[BotAI.getMediumMove] Invalid or empty allMoves:', allMoves);
            return null;
        }
        
        let bestScore = -Infinity;
        let bestScoreMoves = [];
        
        const opponentColor = botColor === 'white' ? 'black' : 'white';

        console.log('[BotAI.getMediumMove] Evaluating', allMoves.length, 'moves...');
        for (const move of allMoves) {
            // Clone game state safely for testing this move
            const clonedGame = this.cloneGameForEvaluation(game);
            
            // Make the test move on the clone
            this.makeMoveOnClonedGame(clonedGame, move.from, move.to);
            
            let kingInCheck = false;
            const piece = clonedGame.board.grid[move.to.row][move.to.col];
            if (piece && !move.to.isCastling) {
                const kingPos = botColor === 'white' ? clonedGame.gameState.whiteKingPos : clonedGame.gameState.blackKingPos;
                kingInCheck = clonedGame.gameState.isSquareUnderAttack(clonedGame.board, kingPos.row, kingPos.col, opponentColor);
            }

            let score = -Infinity;
            if (!kingInCheck) {
                // Evaluate the board state after this move
                score = this.evaluateBoard(clonedGame, botColor);

                const fromPos = `(${move.from.row},${move.from.col})`;
                const toPos = `(${move.to.row},${move.to.col})`;

                const reasons = [];
                
                // Check for repetition in cloned game's history (we need to simulate it)
                if (this.isRepetition(clonedGame, move)) { 
                    score -= 200; 
                    reasons.push('repetition(-200)');
                }

                const isEarlyGame = clonedGame.moveHistory.length < 15;
                const pieceType = piece ? piece.type : '';
                if (pieceType === 'k' && isEarlyGame) {
                    const startRow = botColor === 'white' ? 7 : 0;
                    if (move.from.row !== startRow || move.to.row !== startRow) {
                        score -= 300;
                        reasons.push('earlyKing(-300)');
                    }
                }

                // Check for rook on starting squares
                const pieceTypeForRook = piece ? piece.type : '';
                if (pieceTypeForRook === 'r' && 
                   ((move.to.row === 0 && move.to.col === 0) || (move.to.row === 7 && move.to.col === 7))) {
                    score -= 50;
                    reasons.push('rookStart(-50)');
                }

                console.log(`[BotAI.getMediumMove] ${fromPos} -> ${toPos}: score=${score.toFixed(1)} (${reasons.join(', ')})`);
            } else {
                const fromPos = `(${move.from.row},${move.from.col})`;
                const toPos = `(${move.to.row},${move.to.col})`;
                console.log(`[BotAI.getMediumMove] ${fromPos} -> ${toPos}: kingInCheck`);
            }

            if (score > bestScore) { 
                bestScore = score; 
                bestScoreMoves = [move]; 
            } else if (score === bestScore) { 
                bestScoreMoves.push(move); 
            }
        }
        
        console.log(`[BotAI.getMediumMove] Best score: ${bestScore}, Options count: ${bestScoreMoves.length}`);

        // Return move or null if none found
        const result = bestScoreMoves.length > 0
            ? bestScoreMoves[Math.floor(Math.random() * bestScoreMoves.length)]
            : (allMoves && allMoves.length > 0) ? allMoves[0] : null;
            
        console.log('[BotAI.getMediumMove] Result:', result ? 'valid move' : 'null');
        return result;
    }

    getHardMove(game, botColor, allMoves) {
        const safeMoves = [];
        
        for (const move of allMoves) {
            // Clone game state safely
            const clonedGame = this.cloneGameForEvaluation(game);
            
            // Make the test move on clone
            this.makeMoveOnClonedGame(clonedGame, move.from, move.to);
            
            let kingInCheck = false;
            const piece = clonedGame.board.grid[move.to.row][move.to.col];
            if (piece && !move.to.isCastling) {
                const opponentColor = botColor === 'white' ? 'black' : 'white';
                const kingPos = botColor === 'white' ? clonedGame.gameState.whiteKingPos : clonedGame.gameState.blackKingPos;
                kingInCheck = clonedGame.gameState.isSquareUnderAttack(clonedGame.board, kingPos.row, kingPos.col, opponentColor);
            }
            
            if (!kingInCheck) { safeMoves.push(move); }
        }

        const candidates = safeMoves.length > 0 ? safeMoves : allMoves;

        if (candidates.length === 0) {
            return null;
        }

        let bestMove = null;
        let bestScore = -Infinity;

        for (const move of candidates) {
            // Clone game state safely
            const clonedGame = this.cloneGameForEvaluation(game);
            
            // Make the test move on clone
            this.makeMoveOnClonedGame(clonedGame, move.from, move.to);
            
            const opponentColor = botColor === 'white' ? 'black' : 'white';
            let oppScore = this.minimax(clonedGame, opponentColor, 1);
            
            // Calculate check penalty based on cloned game state
            let checkPenalty = 0;
            if (clonedGame.gameState.isSquareUnderAttack(clonedGame.board, 
                botColor === 'white' ? clonedGame.gameState.whiteKingPos : clonedGame.gameState.blackKingPos,
                opponentColor)) {
                checkPenalty = -500;
            }
            
            const score = -oppScore + checkPenalty;

            let repetitionPenalty = 0;
            if (this.isRepetition(clonedGame, move)) { repetitionPenalty = -300; }

            const isEarlyGame = clonedGame.moveHistory.length < 15;
            const pieceType = clonedGame.board.grid[move.to.row][move.to.col] ? clonedGame.board.grid[move.to.row][move.to.col].type : '';
            if (pieceType === 'k' && isEarlyGame) {
                score -= 200;
            }

            if (score > bestScore) {
                bestScore = score;
                bestMove = move;
            }
        }

        return bestMove || candidates[0];
    }

    minimax(game, color, depth, alpha = -Infinity, beta = Infinity) {
        const moves = this.getAllLegalMovesForColor(game, color);

        if (moves.length === 0 || depth === 0) {
            let score;
            if (moves.length === 0) {
                score = game.gameState.isCheck(color)
                    ? (color === 'black' ? -100000 : 100000)
                    : 0;
            } else {
                score = this.evaluateBoardWithCaptures(game, color);
            }
            return score;
        }

        const scoredMoves = moves.map(move => ({
            move,
            captureValue: this.pieceValues[game.board.grid[move.to.row][move.to.col]?.type || 0] * 10 + (move.isEnPassant ? 50 : 0)
        }));

        if (color === 'black') { scoredMoves.sort((a, b) => b.captureValue - a.captureValue); }
        else { scoredMoves.sort((a, b) => a.captureValue - b.captureValue); }

        let bestScore;

        if (color === 'black') {
            bestScore = alpha;
            for (const item of scoredMoves) {
                // Clone game state safely
                const clonedGame = this.cloneGameForEvaluation(game);
                
                // Make the test move on clone
                this.makeMoveOnClonedGame(clonedGame, item.move.from, item.move.to);
                
                // After making a move, it's white's turn next
                const score = this.minimax(clonedGame, 'white', depth - 1, bestScore, beta);
                bestScore = Math.max(bestScore, score);
                if (bestScore >= beta) { break; }
            }
        } else {
            bestScore = beta;
            for (const item of scoredMoves) {
                // Clone game state safely
                const clonedGame = this.cloneGameForEvaluation(game);
                
                // Make the test move on clone
                this.makeMoveOnClonedGame(clonedGame, item.move.from, item.move.to);
                
                // After making a move, it's black's turn next
                const score = this.minimax(clonedGame, 'black', depth - 1, alpha, bestScore);
                bestScore = Math.min(bestScore, score);
                if (bestScore <= alpha) { break; }
            }
        }

        return bestScore;
    }

    evaluateBoardWithCaptures(game, color) {
        const moves = this.getAllLegalMovesForColor(game, color);
        let bestCaptureValue = 0;

        for (const move of moves) {
            if (game.board.grid[move.to.row][move.to.col] || move.isEnPassant) {
                let capturedPieceType = game.board.grid[move.to.row][move.to.col]?.type || 'p';
                const captureValue = this.pieceValues[capturedPieceType];
                if (captureValue > bestCaptureValue) { bestCaptureValue = captureValue; }
            }
        }

        const baseScore = this.evaluateBoard(game, color);
        return baseScore + (color === 'black'
            ? Math.min(bestCaptureValue, 500)
            : -Math.min(bestCaptureValue, 500));
    }

    makeMove(game) {
        const botColor = 'black';
        console.log(`\n=== [BotAI.makeMove] Black's Turn ===`);
        console.log('[BotAI.makeMove] Bot difficulty:', this.difficulty);
        
        const allMoves = this.getAllLegalMovesForColor(game, botColor);

        if (allMoves.length === 0) {
            if (game.gameState.isCheck(botColor)) { return { type: 'checkmate', winner: game.gameState.currentTurn }; }
            else { return { type: 'stalemate' }; }
        }

        console.log(`[BotAI.makeMove] All ${allMoves.length} legal moves:`);
        allMoves.forEach((m, i) => {
            const fromPos = `${columns[m.from.col]}${rows[m.from.row]}`;
            const toPos = `${columns[m.to.col]}${rows[m.to.row]}`;
            console.log(`  [${i}] ${fromPos} -> ${toPos}`);
        });

        let bestMove = null;

        switch (this.difficulty) {
            case 'easy': 
                bestMove = this.getRandomMove(game, allMoves);
                break;
            case 'medium': 
                bestMove = this.getMediumMove(game, botColor, allMoves); 
                console.log('[BotAI.makeMove] Medium difficulty selected move');
                break;
            case 'hard': 
                bestMove = this.getHardMove(game, botColor, allMoves); 
                console.log('[BotAI.makeMove] Hard difficulty selected move');
                break;
        }

        if (!bestMove || !bestMove.from || !bestMove.to) {
            console.warn('[BotAI.makeMove] No valid move found, using first available');
            bestMove = allMoves[0];
        }

        const fromPos = `${columns[bestMove.from.col]}${rows[bestMove.from.row]}`;
        const toPos = `${columns[bestMove.to.col]}${rows[bestMove.to.row]}`;
        console.log(`[BotAI.makeMove] SELECTED: ${fromPos} -> ${toPos}\n`);

        return { type: 'move', from: bestMove.from, to: bestMove.to };
    }
}

class ChessGame {
    constructor(board) {
        this.board = board || (window.board || new ChessBoard());
        this.gameState = new GameState(this.board);
        this.dialog = new MCPDialog();
        this.botAI = null;
        this.selectedSquare = null;
        this.legalMoves = [];
        this.moveHistory = [];
        this.gameActive = true;
        this.lastMove = null;
        this.currentTurnTime = null;
        this.currentTime = { white: 0, black: 0 };
        this.timerInterval = null;
    }

    async init(botDifficulty) {
        console.log('[ChessGame.init] Starting...');
        try {
            await this.createNewGame();
            this.botAI = new BotAI(botDifficulty);
            console.log('[ChessGame.init] Completed');
        } catch (e) { console.error('[ChessGame.init] Error:', e); }
    }

    async createNewGame() {
        console.log('[ChessGame.createNewGame] Starting...');
        try {
            localStorage.removeItem('chessGame');
            this.board.initializeBoard();
            this.gameState = new GameState(this.board);
            this.selectedSquare = null;
            this.legalMoves = [];
            this.moveHistory = [];
            this.gameActive = true;
            this.lastMove = null;

            this.currentTime = { white: 0, black: 0 };
            this.currentTurnTime = null;
            stopTimer();

            await autoSave();
            renderBoard();
            renderMoveHistory();
            updateStatus();
        } catch (e) { console.error('[ChessGame.createNewGame] Error:', e); }
    }

    async resetToStartingPosition() {
        console.log('[ChessGame.resetToStartingPosition] Starting...');
        try {
            localStorage.removeItem('chessGame');
            this.moveHistory = [];
            this.board.initializeBoard();
            this.gameState.enPassantTarget = null;
            this.gameState.castlingRights = {
                whiteKingMoved: false, blackKingMoved: false,
                whiteRookKingSideMoved: false, whiteRookQueenSideMoved: false,
                blackRookKingSideMoved: false, blackRookQueenSideMoved: false
            };
            this.gameState.whiteKingPos = { row: 7, col: 4 };
            this.gameState.blackKingPos = { row: 0, col: 4 };

            this.currentTime = { white: 0, black: 0 };
            this.currentTurnTime = null;
            stopTimer();

            await autoSave();
            renderBoard();
        } catch (e) { console.error('[ChessGame.resetToStartingPosition] Error:', e); }
    }

    async executeMove(from, to) {
        const piece = this.board.grid[from.row][from.col];
        const targetPiece = this.board.grid[to.row][to.col];

        if (to.isEnPassant) {
            const capturedPawnRow = piece.color === 'white' ? to.row + 1 : to.row - 1;
            this.board.grid[capturedPawnRow][to.col] = null;
        }

        if (to.isCastling === 'kingside') {
            const rookRow = from.row;
            this.board.grid[rookRow][5] = this.board.grid[rookRow][7];
            this.board.grid[rookRow][7] = null;
            const colorKey = piece.color === 'white' ? 'whiteRookKingSideMoved' : 'blackRookKingSideMoved';
            this.gameState.castlingRights[colorKey] = true;
        } else if (to.isCastling === 'queenside') {
            const rookRow = from.row;
            this.board.grid[rookRow][3] = this.board.grid[rookRow][0];
            this.board.grid[rookRow][0] = null;
            const colorKey = piece.color === 'white' ? 'whiteRookQueenSideMoved' : 'blackRookQueenSideMoved';
            this.gameState.castlingRights[colorKey] = true;
        }

        if (piece.type === 'r') {
            const whiteQueenside = piece.color === 'white' && from.row === 7 && from.col === 0;
            const whiteKingside = piece.color === 'white' && from.row === 7 && from.col === 7;
            const blackQueenside = piece.color === 'black' && from.row === 0 && from.col === 0;
            const blackKingside = piece.color === 'black' && from.row === 0 && from.col === 7;

            if (piece.color === 'white') {
                this.gameState.castlingRights.whiteRookQueenSideMoved |= whiteQueenside;
                this.gameState.castlingRights.whiteRookKingSideMoved |= whiteKingside;
            } else {
                this.gameState.castlingRights.blackRookQueenSideMoved |= blackQueenside;
                this.gameState.castlingRights.blackRookKingSideMoved |= blackKingside;
            }
        }

        if (piece.type === 'k') {
            const colorKey = piece.color === 'white' ? 'whiteKingMoved' : 'blackKingMoved';
            this.gameState.castlingRights[colorKey] = true;
            if (piece.color === 'white') { this.gameState.whiteKingPos = { row: to.row, col: to.col }; }
            else { this.gameState.blackKingPos = { row: to.row, col: to.col }; }
        }

        this.board.grid[to.row][to.col] = piece;
        this.board.grid[from.row][from.col] = null;

        if (piece.type === 'p') {
            const lastRowWhite = 0;
            const lastRowBlack = 7;
            
            if (to.row === lastRowWhite || to.row === lastRowBlack) {
                this.board.grid[to.row][to.col] = new Queen(piece.color);
            }
        }

        if (to.isDoublePawn) {
            this.gameState.enPassantTarget = { row: Math.floor((from.row + to.row) / 2), col: from.col };
        } else { this.gameState.enPassantTarget = null; }

        recordMove(from, to, piece, targetPiece);
        this.lastMove = { from, to };

        if (this.checkKingCapture()) {
            this.gameActive = false;
            updateStatus();
        } else if (this.gameState.isCheckmate()) {
            this.gameActive = false;
            updateStatus();
        } else if (this.gameState.isStalemate()) {
            this.gameActive = false;
            updateStatus();
        } else {
            this.gameState.switchTurn();
            updateStatus();
        }

        try { await autoSave(); } catch (e) { console.error('[executeMove] AutoSave error:', e); }
        
        deselectAll();
        renderMoveHistory();

        if (!this.botAI) { startTimer(); }

        if (botDifficulty !== 'none' && this.gameState.currentTurn === 'black' && this.gameActive) {
            const self = this;
            setTimeout(() => {
                const result = self.botAI.makeMove(self);
                console.log('[ChessGame.executeMove] Bot result:', result);

                if (result.type === 'checkmate') { this.gameActive = false; updateStatus(); }
                else if (result.type === 'stalemate') { this.gameActive = false; updateStatus(); }
                else if (result.from && result.to) {
                    console.log('[ChessGame.executeMove] Executing bot move');
                    self.executeMove(result.from, result.to);
                }
            }, 500);
        }
    }

    checkKingCapture() {
        const whiteKingPos = this.gameState.findKing('white');
        const blackKingPos = this.gameState.findKing('black');

        if (!whiteKingPos) return 'black';
        if (!blackKingPos) return 'white';
        return null;
    }

    getLegalMoves(board, row, col) { return this.gameState.getLegalMoves(board, row, col); }
}

const chessBoardElement = document.getElementById('mcp-board-grid-8x8');
const gameStatusElement = document.getElementById('mcp-status-display');
const moveHistoryList = document.getElementById('mcp-move-history-list');

const PIECES = {
    white: { k: '♔', q: '♕', r: '♖', b: '♗', n: '♘', p: '♙' },
    black: { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' }
};

const columns = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
const rows = ['8', '7', '6', '5', '4', '3', '2', '1'];

// Store references to board squares for efficient updates
const squareMap = {}; // keyed by data-chessCoord

const initialBotDifficulties = {
    'none': 'none',
    'easy': 'easy', 
    'medium': 'medium',
    'hard': 'hard'
};

// Get bot difficulty from dropdown, default to medium if not found
const selectElement = document.getElementById('mcp-bot-difficulty-select');
let botDifficulty = initialBotDifficulties[selectElement?.value] || 'medium';

let chessGame;
window.chessApp = {
    getChessGame: () => chessGame,

};

};
