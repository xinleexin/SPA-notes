<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPA Chess</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            padding: 10px;
            background: #2c3e50;
            color: white;
            font-size: 1.5rem;
        }

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
        }

        .panel {
            padding: 15px;
            overflow-y: auto;
        }

        .board-panel {
            flex: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ecf0f1;
            padding: 20px;
        }

        .resize-handle {
            width: 5px;
            background: #bdc3c7;
            cursor: col-resize;
            transition: background 0.2s;
            position: relative;
        }

        .resize-handle:hover {
            background: #7f8c8d;
        }

        .history-panel {
            flex: 1;
            min-width: 250px;
            max-width: 300px;
            background: #fff;
            border-left: 1px solid #bdc3c7;
        }

        /* Chess Board */
        #mcp-board-grid-8x8 {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 12px solid #5d4037;
            user-select: none;
            max-width: 126vh;
            max-height: 126vh;
            aspect-ratio: 1 / 1;
            box-shadow:
                inset 4px 4px 8px rgba(255, 255, 255, 0.3),
                inset -4px -4px 8px rgba(0, 0, 0, 0.4),
                10px 10px 30px rgba(0, 0, 0, 0.5);
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(22px, 8vh, 64px);
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s ease;
        }

        /* White squares - warm wood-like color */
        .square.white {
            background: linear-gradient(135deg, #f0e6d2 0%, #e8dcc5 100%);
            box-shadow:
                inset 1px 1px 0 rgba(255, 255, 255, 0.4),
                inset -1px -1px 0 rgba(0, 0, 0, 0.08);
        }

        /* Black squares - dark walnut color */
        .square.black {
            background: linear-gradient(135deg, #795548 0%, #6d4c41 100%);
            box-shadow:
                inset 1px 1px 0 rgba(255, 255, 255, 0.1),
                inset -1px -1px 0 rgba(0, 0, 0, 0.3);
        }

        .square.selected {
            background: linear-gradient(135deg, #f1c40f 0%, #d4ac0d 100%) !important;
            box-shadow:
                inset 2px 2px 8px rgba(255, 255, 255, 0.6),
                0 0 15px rgba(241, 196, 15, 0.7);
            animation: pulseSelected 1.5s infinite ease-in-out;
        }

        .square.legal-move {
            cursor: pointer;
        }

        .square.legal-move::after {
            content: '';
            position: absolute;
            width: clamp(8px, 2vh, 16px);
            height: clamp(8px, 2vh, 16px);
            background: radial-gradient(circle at center, rgba(46, 204, 113, 0.9) 0%, rgba(46, 204, 113, 0.5) 70%, transparent 100%);
            border-radius: 50%;
            box-shadow:
                inset 1px 1px 2px rgba(255, 255, 255, 0.3),
                0 0 8px rgba(46, 204, 113, 0.5);
        }

        @keyframes pulseSelected {
            0%, 100% { box-shadow: inset 2px 2px 8px rgba(255, 255, 255, 0.6), 0 0 15px rgba(241, 196, 15, 0.7); }
            50% { box-shadow: inset 3px 3px 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(241, 196, 15, 0.9); }
        }

        .square.last-move {
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%) !important;
            box-shadow:
                inset 1px 1px 8px rgba(255, 255, 255, 0.4),
                0 0 12px rgba(230, 126, 34, 0.5);
        }

        .square.in-check {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%) !important;
            box-shadow:
                inset 2px 2px 8px rgba(255, 255, 255, 0.3),
                0 0 20px rgba(231, 76, 60, 0.8);
        }

        
        /* Piece styling - 3D effect */
        .piece {
            cursor: grab;
            z-index: 1;
            display: inline-block;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        /* White pieces - crisp white with clean outer shadow for depth */
        .piece.white {
            color: #ffffff;
            text-shadow:
                /* Sharp edges - tight shadows only on one side */
                2px 2px 3px rgba(0, 0, 0, 0.4),
                5px 8px 15px rgba(0, 0, 0, 0.5);
            filter: drop-shadow(4px 6px 8px rgba(0, 0, 0, 0.3));
        }

        /* Black pieces - 3D polished black look with subtle sheen */
        .piece.black {
            color: #0a0b0d;
            text-shadow:
                /* Inner highlight for depth */
                1px 1px 2px rgba(255, 255, 255, 0.4),
                /* Mid-level gradient shadows */
                -1px -1px 0 #3a3b40,
                2px 2px 0 #2d2e33,
                /* Deep outer shadow for floating effect */
                4px 6px 8px rgba(0, 0, 0, 0.7),
                10px 15px 25px rgba(0, 0, 0, 0.5);
        }

        /* Hover effect - lift pieces up and add glow */
        .piece:hover {
            transform: scale(1.1) translateY(-3px);
            filter: brightness(1.15) drop-shadow(8px 12px 16px rgba(0, 0, 0, 0.4));
            z-index: 10;
        }

        /* Game Status */
        #mcp-status-display {
            margin-top: 15px;
            padding: 10px 20px;
            background: #34495e;
            color: white;
            border-radius: 5px;
            font-size: 1.2rem;
        }

        /* Move History */
        .history-panel h3 {
            padding-bottom: 10px;
            border-bottom: 1px solid #bdc3c7;
            color: #2c3e50;
        }

        #mcp-move-history-list {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .history-row {
            display: flex;
            padding: 5px 10px;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }

        .history-row:nth-child(odd) {
            background: #f8f9fa;
        }

        .history-index {
            width: 30px;
            color: #7f8c8d;
        }

        .history-move {
            flex: 1;
            font-family: monospace;
        }

        /* Buttons */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        /* Coordinates */
        .coord-rank {
            position: absolute;
            left: 2px;
            top: 2px;
            font-size: 10px;
            color: #7f8c8d;
        }

        .coord-file {
            position: absolute;
            right: 2px;
            bottom: 2px;
            font-size: 10px;
            color: #7f8c8d;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .resize-handle {
                width: 100%;
                height: 5px;
                cursor: row-resize;
            }

            .history-panel {
                max-width: 100%;
                min-height: 200px;
            }

            .board-panel {
                flex: 1;
            }
        }

        /* Chess Clock Display */
        .chess-clock {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 15px;
            background: #ecf0f1;
            border-radius: 8px;
            font-family: monospace;
        }

        .player-time {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px;
            min-width: 60px;
            background: #fff;
            border-radius: 4px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
        }

        .player-time.white {
            border-bottom: 3px solid #ecf0f1;
        }

        .player-time.black {
            border-top: 3px solid #95a5a6;
        }

        .player-name {
            font-size: 0.8rem;
            color: #7f8c8d;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .time-display {
            font-size: 1.3rem;
            color: #2c3e50;
            font-weight: bold;
        }

        .player-time.active {
            background: linear-gradient(135deg, #f1c40f 0%, #d4ac0d 100%);
            box-shadow:
                inset 2px 2px 8px rgba(255, 255, 255, 0.6),
                0 0 10px rgba(241, 196, 15, 0.7);
        }

        .player-time.active.white {
            border-bottom-color: #f1c40f;
        }

        .player-time.active.black {
            border-top-color: #d4ac0d;
        }
        
        /* Custom Dialog Styles */
        .mcp-dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .mcp-dialog-container {
            background: white;
            border-radius: 8px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .mcp-dialog-header {
            margin-bottom: 16px;
        }
        
        .mcp-dialog-title {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .mcp-dialog-message {
            color: #7f8c8d;
            line-height: 1.6;
        }
        
        .mcp-dialog-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }
        
        /* Promotion Options */
        .promotion-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .promotion-option {
            padding: 16px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 3rem;
            transition: all 0.2s;
        }
        
        .promotion-option:hover {
            background: #f8f9fa;
            border-color: #3498db;
        }
    </style>
</head>
<body>
    <h1>♟️ SPA Chess</h1>

    <div class="main-container">
        <div class="panel board-panel" role="main">
            <div id="mcp-board-grid-8x8" role="grid" aria-label="Chess Board 8x8"></div>
            <div id="mcp-status-display" role="status" aria-live="polite">White's turn</div>
        </div>

        <div class="resize-handle" id="resizeHandle"></div>

        <div class="panel history-panel">
            <!-- Chess Clock Display -->
            <div id="chessClock" class="chess-clock" style="display: none;">
                <div id="whiteTimeDisplay" class="player-time white active">
                    <span class="player-name">White</span>
                    <span id="currentWhiteTime" class="time-display">00:00</span>
                    <span id="totalWhiteTime" class="time-display" style="font-size: 1rem; margin-top: 4px;">00:00</span>
                </div>
                <!-- Hide black clock when playing against bot -->
                <div id="blackClockContainer">
                    <div id="blackTimeDisplay" class="player-time black">
                        <span class="player-name">Black</span>
                        <span id="currentBlackTime" class="time-display">00:00</span>
                        <span id="totalBlackTime" class="time-display" style="font-size: 1rem; margin-top: 4px;">00:00</span>
                    </div>
                </div>
            </div>

            <h3>Move History</h3>
            <div id="mcp-move-history-list">
                <p style="color: #7f8c8d; text-align: center; padding: 20px;">No moves yet</p>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="mcp-btn-new-game">New Game</button>
                <button class="btn btn-secondary" id="mcp-btn-save-game" aria-label="Save current game">Save Game</button>
                <button class="btn btn-secondary" id="mcp-btn-load-game" aria-label="Load saved game">Load Game</button>
                <button class="btn btn-danger" id="mcp-btn-reset-position">Reset Position</button>
            </div>

            <div id="mcp-bot-settings-panel" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #bdc3c7;" role="region" aria-label="Bot Settings">
                <label for="botDifficultySelect" id="mcp-bot-difficulty-label" style="display: block; margin-bottom: 5px; color: #2c3e50; font-weight: 600;">
                    Bot Difficulty
                </label>
                <select id="mcp-bot-difficulty-select" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #bdc3c7; font-size: 0.9rem;">
                    <option value="none">No Bot (Human vs Human)</option>
                    <option value="easy">Easy (Random)</option>
                    <option value="medium" selected>Medium (2-ply)</option>
                    <option value="hard">Hard (3-ply)</option>
                </select>
                <p style="font-size: 0.8rem; color: #7f8c8d; margin-top: 5px;">
                    Select difficulty or "No Bot" for human vs human
                </p>
            </div>
        </div>
    </div>

<script>
// ============================================
// CHESS GAME SPA - OOD ARCHITECTURE WITH TDD APPROACH
// ============================================

/**
 * Base Piece class with common functionality for all chess pieces.
 */
class Piece {
    constructor(type, color) {
        this.type = type;
        this.color = color;
    }

    getType() { return this.type; }
    
    getColor() { return this.color; }
    
    /**
     * Check if position is valid on 8x8 board
     */
    isValidPosition(row, col) {
        return row >= 0 && row < 8 && col >= 0 && col < 8;
    }

    /**
     * Get pseudo-legal moves (without king safety check)
     * Must be overridden by subclasses
     */
    getPseudoLegalMoves(board, gameState, row, col) {
        throw new Error('getPseudoLegalMoves must be implemented by subclass');
    }
}

/**
 * Pawn class with forward movement and capture rules.
 */
class Pawn extends Piece {
    constructor(color) {
        super('p', color);
    }

    getPseudoLegalMoves(board, gameState, row, col) {
        const moves = [];
        const direction = this.color === 'white' ? -1 : 1;
        const startRow = this.color === 'white' ? 6 : 1;
        const lastRow = this.color === 'white' ? 0 : 7;

        // Forward move
        if (board.isEmpty(row + direction, col)) {
            moves.push({ row: row + direction, col: col });
            
            // Double move from starting position
            if (row === startRow && board.isEmpty(row + direction * 2, col)) {
                moves.push({ 
                    row: row + direction * 2, 
                    col: col, 
                    isDoublePawn: true 
                });
            }
        }

        // Captures (including en passant)
        const captureOffsets = [-1, 1];
        for (const offset of captureOffsets) {
            if (board.isOpponentPiece(row + direction, col + offset, this.color)) {
                moves.push({ row: row + direction, col: col + offset });
            }
            // En passant capture
            else if (gameState.enPassantTarget &&
                     gameState.enPassantTarget.row === row + direction &&
                     gameState.enPassantTarget.col === col + offset) {
                moves.push({
                    row: row + direction,
                    col: col + offset,
                    isEnPassant: true
                });
            }
        }

        return moves;
    }
}

/**
 * Knight class with L-shaped movement pattern.
 */
class Knight extends Piece {
    constructor(color) {
        super('n', color);
    }

    getPseudoLegalMoves(board, gameState, row, col) {
        const moves = [];
        const knightOffsets = [
            { dr: -2, dc: -1 }, { dr: -2, dc: 1 },
            { dr: -1, dc: -2 }, { dr: -1, dc: 2 },
            { dr: 1, dc: -2 }, { dr: 1, dc: 2 },
            { dr: 2, dc: -1 }, { dr: 2, dc: 1 }
        ];

        for (const offset of knightOffsets) {
            const targetRow = row + offset.dr;
            const targetCol = col + offset.dc;

            if (this.isValidPosition(targetRow, targetCol)) {
                if (board.isEmpty(targetRow, targetCol) || 
                    board.isOpponentPiece(targetRow, targetCol, this.color)) {
                    moves.push({ row: targetRow, col: targetCol });
                }
            }
        }

        return moves;
    }
}

/**
 * Base class for sliding pieces (Rook, Bishop, Queen).
 * Provides shared logic for directional movement.
 */
class SlidingPiece extends Piece {
    constructor(type, color) {
        super(type, color);
    }

    /**
     * Get sliding moves in specified directions
     */
    getSlidingMoves(board, gameState, row, col, directions) {
        const moves = [];

        for (const d of directions) {
            let r = row + d.dr;
            let c = col + d.dc;

            while (this.isValidPosition(r, c)) {
                if (board.isEmpty(r, c)) {
                    moves.push({ row: r, col: c });
                } else if (board.isOpponentPiece(r, c, this.color)) {
                    moves.push({ row: r, col: c });
                    break; // Stop after capturing
                } else {
                    break; // Blocked by own piece
                }

                r += d.dr;
                c += d.dc;
            }
        }

        return moves;
    }
}

/**
 * Rook class for horizontal/vertical movement.
 */
class Rook extends SlidingPiece {
    constructor(color) {
        super('r', color);
    }

    getPseudoLegalMoves(board, gameState, row, col) {
        const directions = [
            { dr: -1, dc: 0 }, { dr: 1, dc: 0 },
            { dr: 0, dc: -1 }, { dr: 0, dc: 1 }
        ];

        return this.getSlidingMoves(board, gameState, row, col, directions);
    }
}

/**
 * Bishop class for diagonal movement.
 */
class Bishop extends SlidingPiece {
    constructor(color) {
        super('b', color);
    }

    getPseudoLegalMoves(board, gameState, row, col) {
        const directions = [
            { dr: -1, dc: -1 }, { dr: -1, dc: 1 },
            { dr: 1, dc: -1 }, { dr: 1, dc: 1 }
        ];

        return this.getSlidingMoves(board, gameState, row, col, directions);
    }
}

/**
 * Queen class for horizontal/vertical + diagonal movement.
 */
class Queen extends SlidingPiece {
    constructor(color) {
        super('q', color);
    }

    getPseudoLegalMoves(board, gameState, row, col) {
        const directions = [
            { dr: -1, dc: 0 }, { dr: 1, dc: 0 },
            { dr: 0, dc: -1 }, { dr: 0, dc: 1 },
            { dr: -1, dc: -1 }, { dr: -1, dc: 1 },
            { dr: 1, dc: -1 }, { dr: 1, dc: 1 }
        ];

        return this.getSlidingMoves(board, gameState, row, col, directions);
    }
}

/**
 * King class with one-square movement and castling logic.
 */
class King extends Piece {
    constructor(color) {
        super('k', color);
    }

    getPseudoLegalMoves(board, gameState, row, col) {
        const moves = [];

        // Normal king moves (one square in any direction)
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;

                const targetRow = row + dr;
                const targetCol = col + dc;

                if (this.isValidPosition(targetRow, targetCol)) {
                    if (board.isEmpty(targetRow, targetCol) || 
                        board.isOpponentPiece(targetRow, targetCol, this.color)) {
                        moves.push({ row: targetRow, col: targetCol });
                    }
                }
            }
        }

        // Castling logic
        const colorKey = this.color === 'white' ? 'whiteKingMoved' : 'blackKingMoved';
        if (!gameState.castlingRights[colorKey] &&
            !gameState.isSquareUnderAttack(row, col, this.color === 'white' ? 'black' : 'white')) {

            // King-side castling
            const kingsideRookMoved = this.color === 'white' 
                ? gameState.castlingRights.whiteRookKingSideMoved 
                : gameState.castlingRights.blackRookKingSideMoved;
            
            if (!kingsideRookMoved && board.isEmpty(row, 5) && board.isEmpty(row, 6)) {
                if (!gameState.isSquareUnderAttack(row, 5, this.color === 'white' ? 'black' : 'white') &&
                    !gameState.isSquareUnderAttack(row, 6, this.color === 'white' ? 'black' : 'white')) {
                    moves.push({ row: row, col: 6, isCastling: 'kingside' });
                }
            }

            // Queen-side castling
            const queensideRookMoved = this.color === 'white'
                ? gameState.castlingRights.whiteRookQueenSideMoved
                : gameState.castlingRights.blackRookQueenSideMoved;
            
            if (!queensideRookMoved && board.isEmpty(row, 1) && board.isEmpty(row, 2) && board.isEmpty(row, 3)) {
                if (!gameState.isSquareUnderAttack(row, 3, this.color === 'white' ? 'black' : 'white') &&
                    !gameState.isSquareUnderAttack(row, 2, this.color === 'white' ? 'black' : 'white')) {
                    moves.push({ row: row, col: 2, isCastling: 'queenside' });
                }
            }
        }

        return moves;
    }
}

/**
 * Factory function to create pieces by type and color.
 */
function createPiece(type, color) {
    switch (type) {
        case 'p': return new Pawn(color);
        case 'n': return new Knight(color);
        case 'b': return new Bishop(color);
        case 'r': return new Rook(color);
        case 'q': return new Queen(color);
        case 'k': return new King(color);
        default: throw new Error(`Unknown piece type: ${type}`);
    }
}

/**
 * ChessBoard class for managing the 8x8 grid and piece positions.
 */
class ChessBoard {
    constructor() {
        this.grid = Array(8).fill(null).map(() => Array(8).fill(null));
    }

    /**
     * Initialize board with starting position
     */
    initializeBoard() {
        // Clear board first
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                this.grid[row][col] = null;
            }
        }

        // Black pieces (row 0-1)
        this.grid[0] = [
            new Rook('black'), new Knight('black'), new Bishop('black'),
            new Queen('black'), new King('black'), new Bishop('black'),
            new Knight('black'), new Rook('black')
        ];
        for (let col = 0; col < 8; col++) {
            this.grid[1][col] = new Pawn('black');
        }

        // White pieces (row 6-7)
        for (let col = 0; col < 8; col++) {
            this.grid[6][col] = new Pawn('white');
        }
        this.grid[7] = [
            new Rook('white'), new Knight('white'), new Bishop('white'),
            new Queen('white'), new King('white'), new Bishop('white'),
            new Knight('white'), new Rook('white')
        ];
    }

    /**
     * Get piece at position
     */
    getPiece(row, col) {
        if (!this.isValidPosition(row, col)) return null;
        return this.grid[row][col];
    }

    /**
     * Set piece at position
     */
    setPiece(row, col, piece) {
        if (this.isValidPosition(row, col)) {
            this.grid[row][col] = piece;
        }
    }

    /**
     * Check if square is empty
     */
    isEmpty(row, col) {
        return !this.getPiece(row, col);
    }

    /**
     * Check if position is valid on 8x8 board
     */
    isValidPosition(row, col) {
        return row >= 0 && row < 8 && col >= 0 && col < 8;
    }

    /**
     * Check if piece at position belongs to given color
     */
    isOwnPiece(row, col, color) {
        const piece = this.getPiece(row, col);
        return piece && piece.color === color;
    }

    /**
     * Check if piece at position belongs to opponent
     */
    isOpponentPiece(row, col, color) {
        const piece = this.getPiece(row, col);
        return piece && piece.color !== color;
    }

    /**
     * Create a deep copy of the board for AI search
     */
    copyGrid() {
        return this.grid.map(row => row.map(piece => piece ? { type: piece.type, color: piece.color } : null));
    }
}

/**
 * GameState class for managing game state and rules.
 */
class GameState {
    constructor() {
        this.currentTurn = 'white';
        this.enPassantTarget = null;
        this.castlingRights = {
            whiteKingMoved: false,
            blackKingMoved: false,
            whiteRookKingSideMoved: false,  // h1
            whiteRookQueenSideMoved: false, // a1
            blackRookKingSideMoved: false,  // h8
            blackRookQueenSideMoved: false  // a8
        };
        this.lastMove = null;
        this.whiteKingPos = { row: 7, col: 4 };
        this.blackKingPos = { row: 0, col: 4 };
    }

    /**
     * Switch turn between white and black
     */
    switchTurn() {
        this.currentTurn = this.currentTurn === 'white' ? 'black' : 'white';
    }

    /**
     * Find king position for given color
     */
    findKing(color) {
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const piece = board.grid[row][col];
                if (piece && piece.type === 'k' && piece.color === color) {
                    return { row, col };
                }
            }
        }
        return null;
    }

    /**
     * Check if a square is under attack by opponent
     */
    isSquareUnderAttack(row, col, attackerColor) {
        // Check pawn attacks
        const pawnDirection = attackerColor === 'white' ? -1 : 1;
        const pawnAttackerRow = row + pawnDirection;
        
        if (board.isValidPosition(pawnAttackerRow, col - 1)) {
            const piece = board.getPiece(pawnAttackerRow, col - 1);
            if (piece && piece.color === attackerColor && piece.type === 'p') return true;
        }
        if (board.isValidPosition(pawnAttackerRow, col + 1)) {
            const piece = board.getPiece(pawnAttackerRow, col + 1);
            if (piece && piece.color === attackerColor && piece.type === 'p') return true;
        }

        // Check knight attacks
        const knightMoves = [
            { dr: -2, dc: -1 }, { dr: -2, dc: 1 },
            { dr: -1, dc: -2 }, { dr: -1, dc: 2 },
            { dr: 1, dc: -2 }, { dr: 1, dc: 2 },
            { dr: 2, dc: -1 }, { dr: 2, dc: 1 }
        ];
        
        for (const move of knightMoves) {
            if (board.isValidPosition(row + move.dr, col + move.dc)) {
                const piece = board.getPiece(row + move.dr, col + move.dc);
                if (piece && piece.color === attackerColor && piece.type === 'n') return true;
            }
        }

        // Check king attacks
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                if (board.isValidPosition(row + dr, col + dc)) {
                    const piece = board.getPiece(row + dr, col + dc);
                    if (piece && piece.color === attackerColor && piece.type === 'k') return true;
                }
            }
        }

        // Check sliding pieces
        const directions = [
            { dr: -1, dc: 0 }, { dr: 1, dc: 0 },
            { dr: 0, dc: -1 }, { dr: 0, dc: 1 },
            { dr: -1, dc: -1 }, { dr: -1, dc: 1 },
            { dr: 1, dc: -1 }, { dr: 1, dc: 1 }
        ];

        for (let i = 0; i < directions.length; i++) {
            const d = directions[i];
            let r = row + d.dr;
            let c = col + d.dc;
            let distance = 0;

            while (board.isValidPosition(r, c)) {
                distance++;
                const piece = board.getPiece(r, c);

                if (piece) {
                    if (piece.color === attackerColor) {
                        const isRookLike = i < 4;
                        if (piece.type === 'q' || 
                            (isRookLike && piece.type === 'r') ||
                            (!isRookLike && piece.type === 'b')) {
                            return true;
                        }
                        if (piece.type === 'k' && distance === 1) return true;
                    }
                    break;
                }
                r += d.dr;
                c += d.dc;
            }
        }

        return false;
    }

    /**
     * Get pseudo-legal moves for piece at position
     */
    getPseudoLegalMoves(row, col) {
        const piece = board.getPiece(row, col);
        if (!piece || piece.color !== this.currentTurn) return [];

        return piece.getPseudoLegalMoves(board, this, row, col);
    }

    /**
     * Get fully legal moves (filtering out king-in-check moves)
     */
    getLegalMoves(row, col) {
        const piece = board.getPiece(row, col);
        if (!piece || piece.color !== this.currentTurn) return [];

        const pseudoMoves = this.getPseudoLegalMoves(row, col);
        const legalMoves = [];
        const opponentColor = this.currentTurn === 'white' ? 'black' : 'white';

        for (const move of pseudoMoves) {
            // Simulate the move
            const savedTarget = board.grid[move.row][move.col];
            const savedSource = board.grid[row][col];

            board.setPiece(move.row, move.col, savedSource);
            board.setPiece(row, col, null);

            // Update king position if applicable
            let originalKingPos = null;
            let tempKingPos = null;
            
            if (piece.type === 'k') {
                originalKingPos = piece.color === 'white' ? this.whiteKingPos : this.blackKingPos;
                
                if (piece.color === 'white') {
                    tempKingPos = { row: move.row, col: move.col };
                } else {
                    tempKingPos = { row: move.row, col: move.col };
                }
            }

            // Check if king is in check after the move
            const kingInCheck = this.isSquareUnderAttack(
                piece.type === 'k' ? { row: move.row, col: move.col } : 
                    (piece.color === 'white' ? this.whiteKingPos : this.blackKingPos),
                opponentColor
            );

            // Revert the move
            board.setPiece(row, col, savedSource);
            board.setPiece(move.row, move.col, savedTarget);

            if (originalKingPos) {
                if (piece.color === 'white') this.whiteKingPos = originalKingPos;
                else this.blackKingPos = originalKingPos;
            }

            // For castling, verify the rook path is clear
            let validCastling = true;
            if (move.isCastling === 'kingside') {
                const backRow = piece.color === 'white' ? 7 : 0;
                validCastling = !this.isSquareUnderAttack(backRow, 5, opponentColor);
            } else if (move.isCastling === 'queenside') {
                const backRow = piece.color === 'white' ? 7 : 0;
                validCastling = !this.isSquareUnderAttack(backRow, 3, opponentColor);
            }

            if (!kingInCheck && validCastling) {
                legalMoves.push(move);
            }
        }

        return legalMoves;
    }

    /**
     * Check if current player is in check
     */
    isCheck(color) {
        const kingPos = this.findKing(color);
        if (!kingPos) return false;
        
        const opponentColor = color === 'white' ? 'black' : 'white';
        return this.isSquareUnderAttack(kingPos.row, kingPos.col, opponentColor);
    }

    /**
     * Check if current player has any legal moves
     */
    hasLegalMoves(color) {
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const piece = board.getPiece(row, col);
                if (piece && piece.color === color) {
                    if (this.getLegalMoves(row, col).length > 0) return true;
                }
            }
        }
        return false;
    }

    /**
     * Check for checkmate condition
     */
    isCheckmate() {
        return this.isCheck(this.currentTurn) && !this.hasLegalMoves(this.currentTurn);
    }

    /**
     * Check for stalemate condition
     */
    isStalemate() {
        return !this.isCheck(this.currentTurn) && !this.hasLegalMoves(this.currentTurn);
    }
}

/**
 * MCPDialog class for custom dialog component (replaces confirm/prompt).
 */
class MCPDialog {
    constructor() {
        this.overlay = null;
        this.container = null;
        this.resolvePromise = null;
        this.rejectPromise = null;
    }

    /**
     * Show confirmation dialog
     */
    showConfirm(message, title) {
        return new Promise((resolve, reject) => {
            this.resolvePromise = resolve;
            
            // Create overlay if not exists
            if (!this.overlay) {
                this.overlay = document.createElement('div');
                this.overlay.className = 'mcp-dialog-overlay';
                
                this.container = document.createElement('div');
                this.container.className = 'mcp-dialog-container';
                
                const header = document.createElement('div');
                header.className = 'mcp-dialog-header';
                
                const titleEl = document.createElement('h2');
                titleEl.className = 'mcp-dialog-title';
                
                const messageEl = document.createElement('p');
                messageEl.className = 'mcp-dialog-message';
                
                const actions = document.createElement('div');
                actions.className = 'mcp-dialog-actions';
                
                const btnYes = document.createElement('button');
                btnYes.className = 'btn btn-primary';
                btnYes.textContent = 'Yes';
                btnYes.onclick = () => this.close(true);
                
                const btnNo = document.createElement('button');
                btnNo.className = 'btn btn-danger';
                btnNo.textContent = 'No';
                btnNo.onclick = () => this.close(false);
                
                actions.appendChild(btnYes);
                actions.appendChild(btnNo);
                header.appendChild(titleEl);
                header.appendChild(messageEl);
                this.container.appendChild(header);
                this.container.appendChild(actions);
                this.overlay.appendChild(this.container);
                document.body.appendChild(this.overlay);
            }

            // Update content
            const titleEl = this.container.querySelector('.mcp-dialog-title');
            const messageEl = this.container.querySelector('.mcp-dialog-message');
            
            if (title) {
                titleEl.textContent = title;
            } else {
                titleEl.style.display = 'none';
            }
            
            messageEl.textContent = message;

            // Show dialog
            this.overlay.style.display = 'flex';
        });
    }

    /**
     * Close dialog and return result
     */
    close(result) {
        if (this.resolvePromise) {
            this.resolvePromise(result);
            this.resolvePromise = null;
        }
        
        if (this.overlay) {
            this.overlay.style.display = 'none';
        }
    }

    /**
     * Show promotion selection dialog
     */
    showPromotionChoice(color) {

            this.resolvePromise = resolve;

            // Create overlay if not exists
            if (!this.overlay) {

                header.appendChild(titleEl);

                this.container.appendChild(optionsContainer);
                this.container.appendChild(actions);

            } else {

                const existingOptions = this.container.querySelector('.promotion-options');
                if (existingOptions) existingOptions.remove();
                
                // Rebuild options
                const header = this.container.querySelector('.mcp-dialog-header');
                const titleEl = this.container.querySelector('.mcp-dialog-title');
                const messageEl = document.createElement('p');
                messageEl.className = 'mcp-dialog-message';
                
                const optionsContainer = document.createElement('div');
                optionsContainer.className = 'promotion-options';

                ['q', 'r', 'b', 'n'].forEach(type => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'promotion-option piece ' + color;
                    
                    const piecesMap = {
                        white: { q: '♕', r: '♖', b: '♗', n: '♘' },
                        black: { q: '♛', r: '♜', b: '♝', n: '♞' }
                    };
                    
                    optionDiv.textContent = piecesMap[color][type];
                    
                    optionDiv.onclick = () => this.closePromotion(type);
                    optionsContainer.appendChild(optionDiv);
                });
                
                const actions = document.createElement('div');
                actions.className = 'mcp-dialog-actions';
                
                const btnCancel = document.createElement('button');
                btnCancel.className = 'btn btn-secondary';
                btnCancel.textContent = 'Cancel';
                btnCancel.onclick = () => this.closePromotion(null);

                header.appendChild(titleEl);
                header.appendChild(messageEl);
                this.container.appendChild(header);
                this.container.appendChild(optionsContainer);
                this.container.appendChild(actions);
            }

            // Show dialog
            this.overlay.style.display = 'flex';
        });
    }

    /**
     * Close promotion dialog and return choice
     */
    closePromotion(choice) {
        if (this.resolvePromise) {
            this.resolvePromise(choice);
            this.resolvePromise = null;
        }
        
        if (this.overlay) {
            this.overlay.style.display = 'none';
        }
    }
}

            [-30,-40,-40,-50,-50,-40,-40,-30],
            [-30,-40,-40,-50,-50,-40,-40,-30],
            [-30,-40,-40,-50,-50,-40,-40,-30],
            [-30,-40,-40,-50,-50,-40,-40,-30],
            [-20,-30,-30,-40,-40,-30,-30,-20],
            [-10,-20,-20,-20,-20,-20,-20,-10],
            [ 20, 20,  0,  0,  0,  0, 20, 20],
            [ 20, 30, 10,  0,  0, 10, 30, 20]
        ];
    }

    /**
     * Get all legal moves for a color
     */
    getAllLegalMovesForColor(game, color) {
        const moves = [];
        
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const piece = game.board.grid[row][col];
                if (piece && piece.color === color) {
                    const legalMoves = game.gameState.getLegalMoves(row, col);
                    
                    for (const move of legalMoves) {
                        moves.push({ 
                            from: { row, col }, 
                            to: move,
                            isEnPassant: move.isEnPassant
                        });
                    }
                }
            }
        }
        
        return moves;
    }

    /**
     * Make a move on the board (for AI search)
     */
    makeMoveOnBoard(game, from, to) {
        const piece = game.board.grid[from.row][from.col];
        const targetPiece = game.board.grid[to.row][to.col];

        // Save original state for undo
        const savedState = {
            piece: piece,
            target: targetPiece,
            fromRow: from.row,
            fromCol: from.col,
            toRow: to.row,
            toCol: to.col,
            isCastling: to.isCastling || null,
            isEnPassant: to.isEnPassant || false,
            enPassantTarget: game.gameState.enPassantTarget,
            castlingRights: { ...game.gameState.castlingRights },
            whiteKingPos: { ...game.gameState.whiteKingPos },
            blackKingPos: { ...game.gameState.blackKingPos }
        };

        // Handle en passant capture - remove the captured pawn from the adjacent row
        if (to.isEnPassant) {
            const capturedPawnRow = piece.color === 'white' ? to.row + 1 : to.row - 1;
            game.board.grid[capturedPawnRow][to.col] = null;
        }

        // Handle castling - move rook
        if (to && to.isCastling === 'kingside') {
            const rookRow = from.row;
            game.board.grid[rookRow][5] = game.board.grid[rookRow][7];
            game.board.grid[rookRow][7] = null;
            
            const colorKey = piece.color === 'white' ? 'whiteRookKingSideMoved' : 'blackRookKingSideMoved';
            game.gameState.castlingRights[colorKey] = true;
        } else if (to && to.isCastling === 'queenside') {
            const rookRow = from.row;
            game.board.grid[rookRow][3] = game.board.grid[rookRow][0];
            game.board.grid[rookRow][0] = null;
            
            const colorKey = piece.color === 'white' ? 'whiteRookQueenSideMoved' : 'blackRookQueenSideMoved';
            game.gameState.castlingRights[colorKey] = true;
        }

        // Update castling rights for rooks
        if (piece.type === 'r') {
            const whiteRookQueenside = piece.color === 'white' && from.row === 7 && from.col === 0;
            const whiteRookKingside = piece.color === 'white' && from.row === 7 && from.col === 7;
            const blackRookQueenside = piece.color === 'black' && from.row === 0 && from.col === 0;
            const blackRookKingside = piece.color === 'black' && from.row === 0 && from.col === 7;

            if (piece.color === 'white') {
                game.gameState.castlingRights.whiteRookQueenSideMoved |= whiteRookQueenside;
                game.gameState.castlingRights.whiteRookKingSideMoved |= whiteRookKingside;
            } else {
                game.gameState.castlingRights.blackRookQueenSideMoved |= blackRookQueenside;
                game.gameState.castlingRights.blackRookKingSideMoved |= blackRookKingside;
            }
        }

        // Update castling rights for king
        if (piece.type === 'k') {
            const colorKey = piece.color === 'white' ? 'whiteKingMoved' : 'blackKingMoved';
            game.gameState.castlingRights[colorKey] = true;
            
            // Update king position
            if (piece.color === 'white') {
                game.gameState.whiteKingPos = { row: to.row, col: to.col };
            } else {
                game.gameState.blackKingPos = { row: to.row, col: to.col };
            }
        }

        // Move the piece
        game.board.grid[to.row][to.col] = piece;
        game.board.grid[from.row][from.col] = null;

        // Handle pawn promotion (auto-promote to queen for bot search)
        if (piece.type === 'p') {
            const lastRow = piece.color === 'white' ? 0 : 7;
            if (to.row === lastRow) {
                game.board.grid[to.row][to.col] = new Queen(piece.color);
            }
        }

        // Update en passant target
        if (to.isDoublePawn) {
            game.gameState.enPassantTarget = { 
                row: Math.floor((from.row + to.row) / 2), 
                col: from.col 
            };
        } else {
            game.gameState.enPassantTarget = null;
        }

        return savedState;
    }

    /**
     * Undo a move on the board (for AI search)
     */
    undoMoveOnBoard(game, savedState) {
        const { piece, target, fromRow, fromCol, toRow, toCol } = savedState;

        // Revert castling rights first
        game.gameState.castlingRights = { ...savedState.castlingRights };

        // Undo castling rook move - use the stored position info
        if (savedState.isCastling === 'kingside') {
            const backRow = piece.color === 'white' ? 7 : 0;
            game.board.grid[backRow][7] = game.board.grid[backRow][5];
            game.board.grid[backRow][5] = null;
        } else if (savedState.isCastling === 'queenside') {
            const backRow = piece.color === 'white' ? 7 : 0;
            game.board.grid[backRow][0] = game.board.grid[backRow][3];
            game.board.grid[backRow][3] = null;
        }

        // Revert piece position
        game.board.grid[fromRow][fromCol] = piece;
        game.board.grid[toRow][toCol] = target;

        // Revert en passant capture - use the stored position info
        if (savedState.isEnPassant) {
            const capturedColor = piece.color === 'white' ? 'black' : 'white';
            game.board.grid[toRow][toCol] = new Pawn(capturedColor);
        }

        // Revert king positions
        game.gameState.whiteKingPos = { ...savedState.whiteKingPos };
        game.gameState.blackKingPos = { ...savedState.blackKingPos };

        // Restore en passant target
        game.gameState.enPassantTarget = savedState.enPassantTarget;
    }

    /**
     * Evaluate board position
     */
    evaluateBoard(game, botColor) {
        let score = 0;

        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const piece = game.board.grid[row][col];
                if (!piece) continue;

                let value = this.pieceValues[piece.type];

                // Add positional bonus
                let posBonus = 0;
                
                switch (piece.type) {
                    case 'p':
                        posBonus = piece.color === 'white' 
                            ? this.pawnTable[row][col] 
                            : this.pawnTable[7 - row][col];
                        break;
                    case 'n':
                        posBonus = piece.color === 'white'
                            ? this.knightTable[row][col]
                            : this.knightTable[7 - row][col];
                        break;
                    case 'b':
                        posBonus = piece.color === 'white'
                            ? this.bishopTable[row][col]
                            : this.bishopTable[7 - row][col];
                        break;
                    case 'r':
                        posBonus = piece.color === 'white'
                            ? this.rookTable[row][col]
                            : this.rookTable[7 - row][col];
                        break;
                    case 'q':
                        posBonus = piece.color === 'white'
                            ? this.queenTable[row][col]
                            : this.queenTable[7 - row][col];
                        break;
                    case 'k':
                        posBonus = piece.color === 'white'
                            ? this.kingTable[row][col]
                            : this.kingTable[7 - row][col];
                        break;
                }

                if (piece.color === 'black') {
                    score += value + posBonus;
                } else {
                    score -= value + posBonus;
                }
            }
        }

        return score;
    }

    /**
     * Get random move (Easy difficulty)
     */
    getRandomMove(game, allMoves) {
        const safeMoves = [];

        for (const move of allMoves) {
            const savedState = this.makeMoveOnBoard(game, move.from, move.to);
            
            // Check if opponent can capture our moved piece
            const opponentColor = game.gameState.currentTurn === 'white' ? 'black' : 'white';
            const oppLegalMoves = this.getAllLegalMovesForColor(game, opponentColor);
            const opponentCanCapture = oppLegalMoves.some(
                oppMove => 
                    oppMove.to.row === move.to.row && 
                    oppMove.to.col === move.to.col
            );

            this.undoMoveOnBoard(game, savedState);

            if (!opponentCanCapture) {
                safeMoves.push(move);
            }
        }

        const candidates = safeMoves.length > 0 ? safeMoves : allMoves;
        
        // Add random factor for variety
        const weightedMoves = candidates.map(move => ({
            move,
            weight: 1 + Math.random() * 0.1
        }));

        let totalWeight = 0;
        for (const item of weightedMoves) {
            totalWeight += item.weight;
        }

        let random = Math.random() * totalWeight;
        for (const item of weightedMoves) {
            random -= item.weight;
            if (random <= 0) return item.move;
        }
        
        const selected = candidates[Math.floor(Math.random() * candidates.length)];
        // Return just {from, to} structure for makeMove
        return { from: selected.from, to: selected.to };
    }

    /**
     * Get random move (Easy difficulty)
     */
    getRandomMove(game, allMoves) {
        const safeMoves = [];

        for (const move of allMoves) {
            const savedState = this.makeMoveOnBoard(game, move.from, move.to);
            
            // Check if opponent can capture our moved piece
            const opponentColor = game.gameState.currentTurn === 'white' ? 'black' : 'white';
            const oppLegalMoves = this.getAllLegalMovesForColor(game, opponentColor);
            const opponentCanCapture = oppLegalMoves.some(
                oppMove => 
                    oppMove.to.row === move.to.row && 
                    oppMove.to.col === move.to.col
            );

            this.undoMoveOnBoard(game, savedState);

            if (!opponentCanCapture) {
                safeMoves.push(move);
            }
        }

        const candidates = safeMoves.length > 0 ? safeMoves : allMoves;
        
        // Add random factor for variety
        const weightedMoves = candidates.map(move => ({
            move,
            weight: 1 + Math.random() * 0.1
        }));

        let totalWeight = 0;
        for (const item of weightedMoves) {
            totalWeight += item.weight;
        }

        let random = Math.random() * totalWeight;
        for (const item of weightedMoves) {
            random -= item.weight;
            if (random <= 0) return item.move;
        }
        
        const selected = candidates[Math.floor(Math.random() * candidates.length)];
        // Return just {from, to} structure for makeMove
        return { from: selected.from, to: selected.to };
    }

    /**
     * Get medium difficulty move (2-ply search)
     */
    getMediumMove(game, botColor, allMoves) {
        let bestScore = -Infinity;
        let bestScoreMoves = [];

        for (const move of allMoves) {
            const savedState = this.makeMoveOnBoard(game, move.from, move.to);

            // Evaluate resulting position
            let score = this.evaluateBoard(game, 'black');
            
            // Add random factor for variety
            score += Math.random() * 5;

            this.undoMoveOnBoard(game, savedState);

            if (score > bestScore) {
                bestScore = score;
                bestScoreMoves = [move];
            } else if (score === bestScore) {
                bestScoreMoves.push(move);
            }
        }

        // Choose randomly from best moves
        return bestScoreMoves.length > 0 
            ? bestScoreMoves[Math.floor(Math.random() * bestScoreMoves.length)]
            : allMoves[0];
    }

    /**
     * Get hard difficulty move (3-ply minimax)
     */
    getHardMove(game, botColor, allMoves) {
        // Sort moves: prioritize captures first
        const scoredMoves = allMoves.map(move => ({
            move,
            score: this.pieceValues[game.board.grid[move.to.row][move.to.col]?.type || 0] * 10 + (move.isEnPassant ? 50 : 0)
        }));

        scoredMoves.sort((a, b) => b.score - a.score);

        let bestMove = null;
        let bestScore = -Infinity;

        for (const item of scoredMoves) {
            const savedState = this.makeMoveOnBoard(game, item.move.from, item.move.to);
            
            // Minimax at depth 2
            const opponentColor = 'white'; // Bot always plays black, so opponent is white
            const oppScore = this.minimax(game, opponentColor, 2);

            this.undoMoveOnBoard(game, savedState);

            const score = -oppScore;
            if (score > bestScore) {
                bestScore = score;
                bestMove = item.move;
            }
        }

        return bestMove || allMoves[0];
    }

    /**
     * Minimax algorithm with quiescence search
     */
    minimax(game, color, depth) {
        // Save current king positions
        const savedWhiteKingPos = { ...game.gameState.whiteKingPos };
        const savedBlackKingPos = { ...game.gameState.blackKingPos };

        const moves = this.getAllLegalMovesForColor(game, color);

        // Terminal node - check for game over
        if (moves.length === 0) {
            if (game.gameState.isCheck(color)) {
                return color === 'black' ? -100000 : 100000;
            } else {
                return 0; // Stalemate
            }
        }

        // Max depth reached - use quiescence search
        if (depth === 0) {
            const score = this.evaluateBoardWithCaptures(game, color);
            
            game.gameState.whiteKingPos = savedWhiteKingPos;
            game.gameState.blackKingPos = savedBlackKingPos;
            
            return score;
        }

        let bestScore;

        if (color === 'black') {
            // Maximize for black
            bestScore = -Infinity;
            
            for (const move of moves) {
                const savedState = this.makeMoveOnBoard(game, move.from, move.to);
                
                const score = this.minimax(game, 'white', depth - 1);
                this.undoMoveOnBoard(game, savedState);
                
                bestScore = Math.max(bestScore, score);
            }
        } else {
            // Minimize for white
            bestScore = Infinity;
            
            for (const move of moves) {
                const savedState = this.makeMoveOnBoard(game, move.from, move.to);
                
                const score = this.minimax(game, 'black', depth - 1);
                this.undoMoveOnBoard(game, savedState);
                
                bestScore = Math.min(bestScore, score);
            }
        }

        // Restore king positions
        game.gameState.whiteKingPos = savedWhiteKingPos;
        game.gameState.blackKingPos = savedBlackKingPos;

        return bestScore;
    }

    /**
     * Quiescence search: evaluate position considering only captures
     */
    evaluateBoardWithCaptures(game, color) {
        const moves = this.getAllLegalMovesForColor(game, color);

        let bestCaptureValue = 0;
        
        for (const move of moves) {
            if (game.board.grid[move.to.row][move.to.col] || move.isEnPassant) {
                let capturedPieceType = game.board.grid[move.to.row][move.to.col]?.type || 'p';
                const captureValue = this.pieceValues[capturedPieceType];
                
                // Pawn promotion bonus
                if (move.isPromotion && !game.board.grid[move.to.row][move.to.col]) {
                    bestCaptureValue += 800;
                } else if (captureValue > bestCaptureValue) {
                    bestCaptureValue = captureValue;
                }
            }
        }

        const baseScore = this.evaluateBoard(game, color);
        
        // Add bonus for having good capture opportunities
        return baseScore + (color === 'black' 
            ? Math.min(bestCaptureValue, 500) 
            : -Math.min(bestCaptureValue, 500));
    }

    /**
     * Make a move based on difficulty level
     */
    makeMove(game) {
        // Bot always plays for black (the player with pieces at row 0-1)
        const botColor = 'black';
        const allMoves = this.getAllLegalMovesForColor(game, botColor);

        if (allMoves.length === 0) {
            // Bot has no legal moves - check for checkmate or stalemate
            if (game.gameState.isCheck(botColor)) {
                return { type: 'checkmate', winner: game.gameState.currentTurn };
            } else {
                return { type: 'stalemate' };
            }
        }

        let bestMove = null;

        switch (this.difficulty) {
            case 'easy':
                bestMove = this.getRandomMove(game, allMoves);
                break;
            case 'medium':
                bestMove = this.getMediumMove(game, botColor, allMoves);
                break;
            case 'hard':
                bestMove = this.getHardMove(game, botColor, allMoves);
                break;
        }

        return { type: 'move', from: bestMove.from, to: bestMove.to };
    }
}

/**
 * ChessGame class - Main controller orchestrating all components.
 */
class ChessGame {
    constructor() {
        // Use global board instead of creating a new one
        this.board = window.board || new ChessBoard();
        this.gameState = new GameState();
        this.dialog = new MCPDialog();
        this.botAI = null;
        
        // Game state flags
        this.selectedSquare = null;
        this.legalMoves = [];
        this.moveHistory = [];
        this.gameActive = true;
        this.lastMove = null;
        this.currentTurnTime = null;
        this.currentTime = { white: 0, black: 0 };
        this.timerInterval = null;
    }

    /**
     * Initialize game
     */
    async init(botDifficulty) {
        console.log('[ChessGame.init] Starting...');
        
        try {
            await this.createNewGame();
            
            // Setup bot if difficulty is not 'none'
            this.botAI = new BotAI(botDifficulty);
            
            console.log('[ChessGame.init] Completed');
        } catch (e) {
            console.error('[ChessGame.init] Error:', e);
        }
    }

    /**
     * Create a new game
     */
    async createNewGame() {
        console.log('[ChessGame.createNewGame] Starting...');
        
        try {
            this.board.initializeBoard();
            this.gameState = new GameState();
            this.selectedSquare = null;
            this.legalMoves = [];
            this.moveHistory = [];
            this.gameActive = true;
            this.lastMove = null;

            // Reset timer state
            this.currentTime = { white: 0, black: 0 };
            this.currentTurnTime = null;
            stopTimer();  // Call standalone function, not method

            await autoSave();
            
            renderBoard();
            renderMoveHistory();
            updateStatus();
        } catch (e) {
            console.error('[ChessGame.createNewGame] Error:', e);
        }
    }

    /**
     * Reset to starting position (keeping game active)
     */
    async resetToStartingPosition() {
        console.log('[ChessGame.resetToStartingPosition] Starting...');
        
        try {
            this.board.initializeBoard();
            this.gameState.enPassantTarget = null;
            this.gameState.castlingRights = {
                whiteKingMoved: false,
                blackKingMoved: false,
                whiteRookKingSideMoved: false,
                whiteRookQueenSideMoved: false,
                blackRookKingSideMoved: false,
                blackRookQueenSideMoved: false
            };
            this.gameState.whiteKingPos = { row: 7, col: 4 };
            this.gameState.blackKingPos = { row: 0, col: 4 };

            // Reset timer state
            this.currentTime = { white: 0, black: 0 };
            this.currentTurnTime = null;
            stopTimer();  // Call standalone function, not method

            await autoSave();
            
            renderBoard();
        } catch (e) {
            console.error('[ChessGame.resetToStartingPosition] Error:', e);
        }
    }

    /**
     * Execute a move
     */
    async executeMove(from, to) {
        const piece = this.board.grid[from.row][from.col];
        const targetPiece = this.board.grid[to.row][to.col];

        // Handle en passant capture - remove the captured pawn from the adjacent row
        if (to.isEnPassant) {
            const capturedPawnRow = piece.color === 'white' ? to.row + 1 : to.row - 1;
            this.board.grid[capturedPawnRow][to.col] = null;
        }

        // Handle castling - move rook
        if (to.isCastling === 'kingside') {
            const rookRow = from.row;
            this.board.grid[rookRow][5] = this.board.grid[rookRow][7];
            this.board.grid[rookRow][7] = null;
            
            const colorKey = piece.color === 'white' ? 'whiteRookKingSideMoved' : 'blackRookKingSideMoved';
            this.gameState.castlingRights[colorKey] = true;
        } else if (to.isCastling === 'queenside') {
            const rookRow = from.row;
            this.board.grid[rookRow][3] = this.board.grid[rookRow][0];
            this.board.grid[rookRow][0] = null;
            
            const colorKey = piece.color === 'white' ? 'whiteRookQueenSideMoved' : 'blackRookQueenSideMoved';
            this.gameState.castlingRights[colorKey] = true;
        }

        // Update castling rights for rooks
        if (piece.type === 'r') {
            const whiteRookQueenside = piece.color === 'white' && from.row === 7 && from.col === 0;
            const whiteRookKingside = piece.color === 'white' && from.row === 7 && from.col === 7;
            const blackRookQueenside = piece.color === 'black' && from.row === 0 && from.col === 0;
            const blackRookKingside = piece.color === 'black' && from.row === 0 && from.col === 7;

            if (piece.color === 'white') {
                this.gameState.castlingRights.whiteRookQueenSideMoved |= whiteRookQueenside;
                this.gameState.castlingRights.whiteRookKingSideMoved |= whiteRookKingside;
            } else {
                this.gameState.castlingRights.blackRookQueenSideMoved |= blackRookQueenside;
                this.gameState.castlingRights.blackRookKingSideMoved |= blackRookKingside;
            }
        }

        // Update castling rights for king
        if (piece.type === 'k') {
            const colorKey = piece.color === 'white' ? 'whiteKingMoved' : 'blackKingMoved';
            this.gameState.castlingRights[colorKey] = true;

            // Update king position
            if (piece.color === 'white') {
                this.gameState.whiteKingPos = { row: to.row, col: to.col };
            } else {
                this.gameState.blackKingPos = { row: to.row, col: to.col };
            }
        }

        // Move the piece
        this.board.grid[to.row][to.col] = piece;
        this.board.grid[from.row][from.col] = null;

        // Handle pawn promotion (use dialog for human players)
        if (to.isPromotion && piece.color === 'white') {
            const choice = await this.dialog.showPromotionChoice('white');
            
            if (choice) {
                switch (choice) {
                    case 'q': this.board.grid[to.row][to.col] = new Queen(piece.color); break;
                    case 'r': this.board.grid[to.row][to.col] = new Rook(piece.color); break;
                    case 'b': this.board.grid[to.row][to.col] = new Bishop(piece.color); break;
                    case 'n': this.board.grid[to.row][to.col] = new Knight(piece.color); break;
                }
            } else {
                // Default to queen if cancelled
                this.board.grid[to.row][to.col] = new Queen(piece.color);
            }
        }

        // Update en passant target
        if (to.isDoublePawn) {
            this.gameState.enPassantTarget = { 
                row: Math.floor((from.row + to.row) / 2), 
                col: from.col 
            };
        } else {
            this.gameState.enPassantTarget = null;
        }

        // Record the move
        recordMove(from, to, piece, targetPiece);

        // Update last move for highlighting
        this.lastMove = { from, to };

        // Check for game end conditions
        if (this.checkKingCapture()) {
            this.gameActive = false;
            updateStatus();
        } else if (this.gameState.isCheckmate()) {
            this.gameActive = false;
            updateStatus();
        } else if (this.gameState.isStalemate()) {
            this.gameActive = false;
            updateStatus();
        } else {
            // Switch turn
            this.gameState.switchTurn();
            updateStatus();
        }

        await autoSave();
        
        console.log('[ChessGame.executeMove] About to deselectAll and renderMoveHistory');
        
        deselectAll();
        renderMoveHistory();

        // Start timer for new player (if in human vs human mode)
        if (!this.botAI) {
            startTimer();
        }

        // Trigger bot move if it's black's turn and not disabled
        if (botDifficulty !== 'none' && this.gameState.currentTurn === 'black' && this.gameActive) {
            const self = this;
            setTimeout(() => {
                const result = self.botAI.makeMove(self);
                
                console.log('[ChessGame.executeMove] Bot result:', result);
                
                if (result.type === 'checkmate') {
                    this.gameActive = false;
                    updateStatus();
                } else if (result.type === 'stalemate') {
                    this.gameActive = false;
                    updateStatus();
                } else if (result.from && result.to) {
                    console.log('[ChessGame.executeMove] Executing bot move');
                    this.executeMove(result.from, result.to);
                }
            }, 500);
        }
    }

    /**
     * Check for king capture
     */
    checkKingCapture() {
        const whiteKingPos = this.gameState.findKing('white');
        const blackKingPos = this.gameState.findKing('black');

        if (!whiteKingPos) return 'black';
        if (!blackKingPos) return 'white';
        
        return null;
    }

    /**
     * Get legal moves for a square
     */
    getLegalMoves(row, col) {
        return this.gameState.getLegalMoves(row, col);
    }
}

/**
 * Select a square on the board
 */
function selectSquare(row, col) {
    console.log('[SELECT_SQUARE] Clicked:', { row, col });
    
    if (!chessGame.gameActive) {
        console.log('[SELECT_SQUARE] Game not active');
        return;
    }

    const piece = chessGame.board.getPiece(row, col);
    const currentTurn = chessGame.gameState.currentTurn;

    console.log('[SELECT_SQUARE] Piece:', piece ? { type: piece.type, color: piece.color } : 'null', '| Current turn:', currentTurn);

    // If selecting own piece
    if (piece && piece.color === currentTurn) {
        console.log('[SELECT_SQUARE] Selected own piece');
        
        chessGame.selectedSquare = { row, col };
        chessGame.legalMoves = chessGame.getLegalMoves(row, col);
        
        renderBoard();
        return;
    }
    
    console.log('[SELECT_SQUARE] Not selecting own piece or no piece at location');

    // If a square is selected and clicking a legal move
    if (chessGame.selectedSquare) {
        const move = chessGame.legalMoves.find(m => m.row === row && m.col === col);
        
        console.log('[SELECT_SQUARE] Looking for legal move:', { found: !!move });
        
        if (move) {
            console.log('[SELECT_SQUARE] Executing move');
            chessGame.executeMove(chessGame.selectedSquare, move);
            return;
        }
    }

    // Deselect if clicking elsewhere
    deselectAll();
}

/**
 * Deselect all squares
 */
function deselectAll() {
    chessGame.selectedSquare = null;
    chessGame.legalMoves = [];
    renderBoard();
}

/**
 * Record a move to history
 */
function recordMove(from, to, piece, captured) {
    let notation = '';
    
    if (piece.type !== 'p') {
        notation += piece.type.toUpperCase();
    }

    if (captured || to.isEnPassant) {
        if (piece.type === 'p') notation += columns[from.col];
        notation += '×';
    }

    notation += columns[to.col] + rows[to.row];

    // Add check/mate suffix
    const opponentColor = chessGame.gameState.currentTurn === 'white' ? 'black' : 'white';
    
    if (chessGame.gameState.isCheck(opponentColor)) {
        if (chessGame.gameState.isCheckmate()) {
            notation += '#';
        } else {
            notation += '+';
        }
    }

    // Add castling notation
    if (to.isCastling === 'kingside') notation = 'O-O';
    if (to.isCastling === 'queenside') notation = 'O-O-O';

    chessGame.moveHistory.push({
        turn: chessGame.moveHistory.length + 1,
        color: piece.color,
        from: { row: from.row, col: from.col },
        to: { row: to.row, col: to.col },
        piece: piece,
        captured: captured,
        notation: notation
    });
}

    const kingInCheck = chessGame.gameState.isCheck(chessGame.gameState.currentTurn) && chessGame.gameActive;
